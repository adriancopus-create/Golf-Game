<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Golf Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }

    #hud {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font-family: 'Georgia', serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-align: center; pointer-events: none;
    }
    #hud h1 { font-size: 28px; letter-spacing: 3px; font-weight: normal; }
    #hud p  { font-size: 13px; margin-top: 4px; opacity: 0.75; letter-spacing: 1px; }

    #power-wrap {
      position: absolute; bottom: 48px; left: 50%;
      transform: translateX(-50%); text-align: center;
      pointer-events: none; user-select: none;
    }
    #power-label {
      color: #fff; font-family: Georgia, serif; font-size: 11px;
      letter-spacing: 4px; margin-bottom: 7px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    #power-bar-bg {
      width: 240px; height: 15px; background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
      overflow: hidden; margin: 0 auto;
    }
    #power-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right, #4ee04e 0%, #f5d020 55%, #e83030 100%);
      border-radius: 8px; transition: width 0.05s linear;
    }
    #power-hint {
      color: rgba(255,255,255,0.6); font-family: Georgia, serif;
      font-size: 11px; letter-spacing: 2px; margin-top: 7px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    #shot-text {
      position: absolute; top: 36%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-family: Georgia, serif; font-size: 38px;
      letter-spacing: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      pointer-events: none; opacity: 0;
    }
    #dist-text {
      position: absolute; top: 44%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ffe066; font-family: Georgia, serif; font-size: 20px;
      letter-spacing: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      pointer-events: none; opacity: 0;
    }

    #reset-btn {
      position: absolute; bottom: 48px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85); font-family: Georgia, serif;
      font-size: 12px; letter-spacing: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8); cursor: pointer;
      padding: 9px 26px; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px; background: rgba(0,0,0,0.35); display: none;
    }
    #reset-btn:hover { background: rgba(255,255,255,0.12); }

    #minimap-wrap {
      position: absolute; top: 20px; right: 20px;
      pointer-events: none; user-select: none;
    }
    #minimap-label {
      color: rgba(255,255,255,0.8); font-family: Georgia, serif;
      font-size: 10px; letter-spacing: 3px; text-align: center;
      margin-bottom: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #minimap { display: block; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; }

    #club-selector { position: absolute; bottom: 20px; left: 20px; user-select: none; }
    #club-label {
      color: rgba(255,255,255,0.55); font-family: Georgia, serif;
      font-size: 10px; letter-spacing: 3px; margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .club-btn {
      display: block; width: 90px; margin-bottom: 5px; padding: 7px 0;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 3px; color: rgba(255,255,255,0.6);
      font-family: Georgia, serif; font-size: 10px; letter-spacing: 2px;
      cursor: pointer; text-align: center;
    }
    .club-btn:hover:not(.disabled) { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.35); }
    .club-btn.active { border-color: rgba(255,210,40,0.85); color: rgba(255,210,40,0.95); background: rgba(255,210,40,0.1); }
    .club-btn.disabled { opacity: 0.28; cursor: not-allowed; pointer-events: none; }
    .club-key { opacity: 0.45; font-size: 9px; }

    #stroke-counter {
      position: absolute; bottom: 20px; right: 20px;
      color: rgba(255,255,255,0.80); font-family: Georgia, serif;
      font-size: 12px; letter-spacing: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9); pointer-events: none;
    }

    /* ── Preview overlay ─────────────────────────────────────────────── */
    #preview-overlay {
      position: absolute; bottom: 90px; left: 50%;
      transform: translateX(-50%); text-align: center;
      pointer-events: none; transition: opacity 0.8s; opacity: 0;
    }
    #preview-hole-name {
      color: rgba(255,255,255,0.92); font-family: Georgia, serif;
      font-size: 22px; letter-spacing: 6px; margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    }
    #preview-par-info {
      color: rgba(255,255,255,0.55); font-family: Georgia, serif;
      font-size: 12px; letter-spacing: 3px; margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    #preview-skip {
      color: rgba(255,255,255,0.28); font-family: Georgia, serif;
      font-size: 10px; letter-spacing: 3px;
    }

    /* ── Scorecard overlay ───────────────────────────────────────────── */
    #scorecard-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); z-index: 100;
    }
    #scorecard-box {
      background: rgba(10,26,10,0.97); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px; padding: 28px 32px 24px; min-width: 340px;
      font-family: Georgia, serif; color: rgba(255,255,255,0.85);
    }
    #scorecard-title {
      text-align: center; font-size: 18px; letter-spacing: 6px;
      margin-bottom: 20px; text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    #scorecard-table { width: 100%; border-collapse: collapse; font-size: 12px; letter-spacing: 1px; }
    #scorecard-table th {
      color: rgba(255,255,255,0.45); font-size: 10px; letter-spacing: 3px;
      padding: 0 8px 8px; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    #scorecard-table td { padding: 5px 8px; text-align: center; }
    #scorecard-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .sc-eagle  { color: #f5d020; }
    .sc-birdie { color: #5ab4f5; }
    .sc-par    { color: rgba(255,255,255,0.85); }
    .sc-bogey  { color: #f5a623; }
    .sc-double { color: #e87030; }
    .sc-worse  { color: #e84040; }
    .sc-future { color: rgba(255,255,255,0.25); }
    .sc-total  { border-top: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.9); font-size: 13px; }
    #scorecard-buttons { margin-top: 22px; text-align: center; }
    #next-hole-btn, #play-again-btn {
      padding: 10px 28px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.30); border-radius: 4px;
      color: rgba(255,255,255,0.90); font-family: Georgia, serif;
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
    }
    #next-hole-btn:hover, #play-again-btn:hover { background: rgba(255,255,255,0.16); }
  </style>
</head>
<body>

  <div id="hud">
    <h1>GOLF</h1>
    <p>HOLE 1 &nbsp;|&nbsp; PAR 3 &nbsp;|&nbsp; 155 YDS</p>
  </div>

  <div id="power-wrap">
    <div id="power-label">POWER</div>
    <div id="power-bar-bg"><div id="power-bar-fill"></div></div>
    <div id="power-hint">&#8592;&#8594; AIM &nbsp;·&nbsp; HOLD SPACE TO SWING</div>
  </div>

  <div id="shot-text">FORE!</div>
  <div id="dist-text"></div>
  <button id="reset-btn">&#8635;&nbsp; BACK TO TEE (R)</button>

  <div id="minimap-wrap">
    <div id="minimap-label">HOLE 1</div>
    <canvas id="minimap" width="120" height="160"></canvas>
  </div>

  <div id="stroke-counter"></div>

  <div id="preview-overlay">
    <div id="preview-hole-name"></div>
    <div id="preview-par-info"></div>
    <div id="preview-skip">SPACE &nbsp;·&nbsp; SKIP</div>
  </div>

  <div id="scorecard-overlay">
    <div id="scorecard-box">
      <div id="scorecard-title">SCORECARD</div>
      <table id="scorecard-table">
        <thead>
          <tr><th>HOLE</th><th>PAR</th><th>YDS</th><th>SCORE</th><th>+/-</th></tr>
        </thead>
        <tbody id="scorecard-body"></tbody>
        <tfoot id="scorecard-foot"></tfoot>
      </table>
      <div id="scorecard-buttons">
        <button id="next-hole-btn">NEXT HOLE &rarr;</button>
        <button id="play-again-btn" style="display:none">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <div id="club-selector">
    <div id="club-label">CLUB</div>
    <button class="club-btn active"    data-club="driver"><span class="club-key">[1]</span> DRIVER</button>
    <button class="club-btn"           data-club="iron">  <span class="club-key">[2]</span> IRON</button>
    <button class="club-btn"           data-club="wedge"> <span class="club-key">[3]</span> WEDGE</button>
    <button class="club-btn disabled"  data-club="putter"><span class="club-key">[4]</span> PUTTER</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ─── Constants ────────────────────────────────────────────────────────────────
  const BALL_RADIUS        = 0.215;
  const GRAVITY            = -22;
  const BOUNCE_RESTITUTION = 0.38;
  const ROLL_FRICTION      = 0.963;
  const SAND_FRICTION      = 0.87;
  const STOP_SPEED         = 0.10;
  const PREVIEW_DURATION   = 5.5;  // seconds per fly-over

  const CLUBS = {
    driver: { name:'DRIVER', minSpeed:22, maxSpeed:74, angle:0.44, maxTime:2.2, onGreenOnly:false },
    iron:   { name:'IRON',   minSpeed:16, maxSpeed:52, angle:0.52, maxTime:2.2, onGreenOnly:false },
    wedge:  { name:'WEDGE',  minSpeed:11, maxSpeed:36, angle:0.68, maxTime:2.2, onGreenOnly:false },
    putter: { name:'PUTTER', minSpeed: 2, maxSpeed:12, angle:0.03, maxTime:1.5, onGreenOnly:true  },
  };

  // ─── 9-hole course data (scoring only; geometry is in buildHole) ─────────────
  const COURSE = [
    { par:3, yardage:155, name:'MEADOW LANE'    },
    { par:4, yardage:340, name:'ELM RIDGE'      },
    { par:4, yardage:295, name:'HIGHLAND FALLS' },
    { par:3, yardage:180, name:'LAKESIDE'       },
    { par:4, yardage:360, name:'SANDY PINES'    },
    { par:5, yardage:520, name:'OAK VALLEY'     },
    { par:3, yardage:150, name:'ISLE GREEN'     },
    { par:4, yardage:330, name:'THE NARROWS'    },
    { par:4, yardage:410, name:'CHERRY HILL'    },
  ];

  // ─── Mutable per-hole state (updated by buildHole) ───────────────────────────
  const HOLE = {
    par: 3, yardage: 155,
    tee:   { x:0, z:0, elevation:0, platformW:6, platformD:4 },
    green: { x:0, z:-130, radius:9, elevation:0.7 },
    flag:  { x:0, z:-130, color:0xee4422 },
    fairwaySegs: [{ x:0, z:-65, w:24, len:130, ry:0 }],
    rough:  { flanking:22 },
    mm:     { xMin:-40, zMax:8, xRange:80, zRange:156 },
    bunkers:    [],
    waterRects: [],
    islandGreen: false,
    checkWater: () => false,
    flyover: [
      { pos:[25,32,22],   look:[0,2,-60]  },
      { pos:[12,22,-50],  look:[0,2,-100] },
      { pos:[8,14,-100],  look:[0,1,-130] },
      { pos:[4,8,-100],   look:[0,1,-130] },
    ],
  };

  // ─── Game state ───────────────────────────────────────────────────────────────
  let state          = 'preview';
  let chargeStart    = 0;
  let bounceCount    = 0;
  let aimAngle       = 0;
  let flightAimAngle = 0;
  let currentClub    = 'driver';
  const vel          = new THREE.Vector3();
  const camCurrent   = new THREE.Vector3(0, 3.5, 10);
  const lookCurrent  = new THREE.Vector3(0, 0.5, -10);
  const keysHeld     = new Set();
  let isDraggingAim  = false;
  let aimDragLastX   = 0;
  let previewT       = 0;

  // ─── Scoring state ────────────────────────────────────────────────────────────
  let currentHoleIdx = 0;
  let strokeCount    = 0;
  const scores       = [];
  let sinkTimer      = 0;
  let sinkStartY     = 0;

  // ─── Per-hole scene objects ───────────────────────────────────────────────────
  let holeObjects = [];
  let teePeg = null, flagMesh = null;

  // ─── Renderer ────────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.outputEncoding    = THREE.sRGBEncoding;
  renderer.toneMapping       = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // ─── Scene ───────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();

  // Sky gradient sphere
  {
    const skyGeo = new THREE.SphereGeometry(500, 32, 32);
    skyGeo.deleteAttribute('normal'); skyGeo.deleteAttribute('uv');
    const topC = new THREE.Color(0x1a6ebe), horizC = new THREE.Color(0x9ecfe8), botC = new THREE.Color(0x7ab87a);
    const cols = [], pa = skyGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) {
      const t = THREE.MathUtils.clamp((pa.getY(i) + 500) / 1000, 0, 1);
      const c = new THREE.Color();
      if (t < 0.15) c.lerpColors(botC, horizC, t / 0.15);
      else           c.lerpColors(horizC, topC, (t - 0.15) / 0.85);
      cols.push(c.r, c.g, c.b);
    }
    skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  }

  // Lighting
  scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));
  const sun = new THREE.DirectionalLight(0xfff8d6, 1.4);
  sun.position.set(80, 120, 60);
  sun.castShadow = true;
  sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
  sun.shadow.camera.top  =  150; sun.shadow.camera.bottom = -150;
  sun.shadow.camera.near = 0.5;  sun.shadow.camera.far = 500;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003;
  scene.add(sun);
  scene.add(Object.assign(new THREE.DirectionalLight(0xb0d8ff, 0.35), { position: new THREE.Vector3(-60,40,-40) }));

  // ─── Procedural grass texture ─────────────────────────────────────────────────
  const grassTex = (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 512;
    const cx = cv.getContext('2d');
    const hash = (x,y) => { const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); };
    const noise = (x,y) => {
      const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
      const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
      const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
      return a+(b-a)*ux+(c-a)*uy+(b-a+a-b-c+d)*ux*uy;
    };
    const fbm = (x,y) => { let v=0,a=0.5,f=1; for(let o=0;o<5;o++){v+=a*noise(x*f,y*f);a*=0.5;f*=2.1;} return v; };
    const img = cx.createImageData(512,512);
    for (let py=0;py<512;py++) for (let px=0;px<512;px++){
      const n=fbm(px/512*8,py/512*8),b=0.30+n*0.45,i=(py*512+px)*4;
      img.data[i]=Math.round(b*62); img.data[i+1]=Math.round(b*130); img.data[i+2]=Math.round(b*55); img.data[i+3]=255;
    }
    cx.putImageData(img,0,0);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  })();

  // ─── Golf ball ───────────────────────────────────────────────────────────────
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 32, 32),
    new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xaaaaaa, shininess: 120 })
  );
  ball.castShadow = true;
  scene.add(ball);

  const shadowMat = new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.38, depthWrite:false });
  const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), shadowMat);
  ballShadow.rotation.x = -Math.PI / 2;
  scene.add(ballShadow);

  // ─── Particle system ─────────────────────────────────────────────────────────
  const N_PARTICLES = 50;
  const partPosBuf = new Float32Array(N_PARTICLES * 3);
  const partColBuf = new Float32Array(N_PARTICLES * 3);
  const partGeo    = new THREE.BufferGeometry();
  partGeo.setAttribute('position', new THREE.BufferAttribute(partPosBuf, 3));
  partGeo.setAttribute('color',    new THREE.BufferAttribute(partColBuf, 3));
  const partMat = new THREE.PointsMaterial({ size:0.38, vertexColors:true, transparent:true, opacity:1.0, sizeAttenuation:true, depthWrite:false });
  const particles = new THREE.Points(partGeo, partMat);
  particles.visible = false;
  scene.add(particles);
  const partVelArr = Array.from({ length: N_PARTICLES }, () => new THREE.Vector3());
  let partActive = false, partTime = 0;
  const PART_LIFE = 2.5;

  // ─── Aim line & arc ──────────────────────────────────────────────────────────
  const AIM_PTS = 22;
  const aimPosBuf = new Float32Array(AIM_PTS * 3);
  const aimLineGeo = new THREE.BufferGeometry();
  aimLineGeo.setAttribute('position', new THREE.BufferAttribute(aimPosBuf, 3));
  const aimLine = new THREE.Line(aimLineGeo, new THREE.LineDashedMaterial({ color:0xffffff, dashSize:0.85, gapSize:0.55, transparent:true, opacity:0.72 }));
  aimLine.visible = false;
  scene.add(aimLine);

  const aimArrowGroup = new THREE.Group();
  const aimCone = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.9, 8), new THREE.MeshBasicMaterial({ color:0xffde3a, transparent:true, opacity:0.88 }));
  aimCone.rotation.x = Math.PI / 2;
  aimArrowGroup.add(aimCone);
  aimArrowGroup.visible = false;
  scene.add(aimArrowGroup);

  const ARC_CAP = 80;
  const arcPosBuf = new Float32Array(ARC_CAP * 3);
  const arcLineGeo = new THREE.BufferGeometry();
  arcLineGeo.setAttribute('position', new THREE.BufferAttribute(arcPosBuf, 3));
  arcLineGeo.setDrawRange(0, 0);
  const arcLine = new THREE.Line(arcLineGeo, new THREE.LineBasicMaterial({ color:0xffde3a, transparent:true, opacity:0.50 }));
  arcLine.visible = false;
  scene.add(arcLine);

  // ─── Camera ──────────────────────────────────────────────────────────────────
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(camCurrent);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─── UI refs ─────────────────────────────────────────────────────────────────
  const powerWrap      = document.getElementById('power-wrap');
  const powerFill      = document.getElementById('power-bar-fill');
  const shotText       = document.getElementById('shot-text');
  const distText       = document.getElementById('dist-text');
  const resetBtn       = document.getElementById('reset-btn');
  const mmCanvas       = document.getElementById('minimap');
  const mmCtx          = mmCanvas.getContext('2d');
  const strokeCounterEl = document.getElementById('stroke-counter');
  const previewOverlay = document.getElementById('preview-overlay');

  // ─── buildHole ───────────────────────────────────────────────────────────────
  function buildHole(idx) {
    // Clear previous hole geometry
    holeObjects.forEach(o => {
      scene.remove(o);
      o.traverse(c => { if (c.geometry) c.geometry.dispose(); });
    });
    holeObjects = [];
    flagMesh = null; teePeg = null;

    // ── Shared materials created fresh each hole ──────────────────────────────
    const grassMat = new THREE.MeshLambertMaterial({ map: grassTex });
    const roughMat = new THREE.MeshLambertMaterial({ color: 0x2d6a2d });
    const greenMat = new THREE.MeshLambertMaterial({ color: 0x5dbf5d });
    const moundMat = new THREE.MeshLambertMaterial({ color: 0x4a9e4a });
    const sandMat  = new THREE.MeshLambertMaterial({ color: 0xe8cc80 });
    const waterMat = new THREE.MeshLambertMaterial({ color: 0x1a5faa, transparent: true, opacity: 0.82 });

    function addHO(obj)  { holeObjects.push(obj); scene.add(obj); return obj; }

    // Flat plane (no Y-rotation — use addSeg for rotated segments)
    function addPlane(w, d, mat, x, y, z) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, y, z);
      m.receiveShadow = true;
      return addHO(m);
    }

    // Fairway/rough segment with optional Y rotation (via Group)
    function addSeg(cx, cz, w, len, ry, mat, yOff) {
      const grp = new THREE.Group();
      grp.position.set(cx, 0, cz);
      grp.rotation.y = ry;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), mat);
      m.rotation.x = -Math.PI / 2;
      m.position.y = yOff || 0;
      m.receiveShadow = true;
      grp.add(m);
      holeObjects.push(grp);
      scene.add(grp);
      return grp;
    }

    function addBackdrop(z, w) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w || 400, 400), new THREE.MeshLambertMaterial({ color: 0x2d6a2d }));
      m.rotation.x = -Math.PI / 2;
      m.position.set(0, -0.02, z);
      return addHO(m);
    }

    function addHills(z, w, h, color) {

    ball.position.set(HOLE.tee.x, HOLE.tee.elevation + BALL_RADIUS + 0.115, HOLE.tee.z);
    ball.rotation.set(0, 0, 0);
    ball.scale.setScalar(1);
    vel.set(0, 0, 0);
    bounceCount = 0; aimAngle = 0; currentClub = 'driver';
    if (teePeg) teePeg.visible = true;
    distText.style.transition = 'none'; distText.style.opacity = '0';
    resetBtn.style.display  = 'none';
    powerWrap.style.display = 'none';   // hidden during preview
    updateClubSelector(); updateBlobShadow();

    // ── Start fly-over preview ────────────────────────────────────────────────
    state    = 'preview';
    previewT = 0;
    previewOverlay.style.opacity = '1';
    document.getElementById('preview-hole-name').textContent =
      'HOLE ' + (idx + 1) + '  —  ' + COURSE[idx].name;
    document.getElementById('preview-par-info').textContent =
      'PAR ' + COURSE[idx].par + '  ·  ' + COURSE[idx].yardage + ' YDS';
    // Snap camera to first waypoint immediately
    const wp0 = HOLE.flyover[0];
    camera.position.set(wp0.pos[0], wp0.pos[1], wp0.pos[2]);
    camera.lookAt(wp0.look[0], wp0.look[1], wp0.look[2]);
    camCurrent.set(wp0.pos[0], wp0.pos[1], wp0.pos[2]);
    lookCurrent.set(wp0.look[0], wp0.look[1], wp0.look[2]);
  }

  // ─── End preview, hand off to play ───────────────────────────────────────────
  function endPreview() {
    state = 'idle';
    previewOverlay.style.opacity = '0';
    const tx = HOLE.tee.x, ty = HOLE.tee.elevation, tz = HOLE.tee.z;
    camCurrent.set(tx, ty + 3.5, tz + 10);
    lookCurrent.set(tx, ty + 0.5, tz - 10);
    camera.position.copy(camCurrent);
    camera.lookAt(lookCurrent.x, lookCurrent.y, lookCurrent.z);
    powerWrap.style.display = 'block';
    updateStrokeCounter();
    strokeCounterEl.style.display = 'block';
  }

  // ─── Preview camera interpolation ────────────────────────────────────────────
  function updatePreviewCamera(t) {
    const wps = HOLE.flyover, n = wps.length - 1;
    const sc  = t * n;
    const i   = Math.min(Math.floor(sc), n - 1);
    const f   = sc - i;
    const a   = wps[i], b = wps[i + 1];
    const lp  = (a, b, t) => a + (b - a) * t;
    camera.position.set(lp(a.pos[0],b.pos[0],f), lp(a.pos[1],b.pos[1],f), lp(a.pos[2],b.pos[2],f));
    camera.lookAt(lp(a.look[0],b.look[0],f), lp(a.look[1],b.look[1],f), lp(a.look[2],b.look[2],f));
  }

  // ─── Ground elevation (green mound + elevated tee platform) ──────────────────
  function getGroundY(x, z) {
    const dx = x - HOLE.green.x, dz = z - HOLE.green.z;
    if (Math.sqrt(dx*dx + dz*dz) < HOLE.green.radius - 0.3) return HOLE.green.elevation;
    if (HOLE.tee.elevation > 0) {
      if (Math.abs(x - HOLE.tee.x) < HOLE.tee.platformW / 2 &&
          Math.abs(z - HOLE.tee.z) < HOLE.tee.platformD / 2) {
        return HOLE.tee.elevation;
      }
    }
    return 0;
  }

  // ─── Bunker check ─────────────────────────────────────────────────────────────
  function isInBunker(x, z) {
    for (const b of HOLE.bunkers) {
      const dx = (x - b.x) / b.rx, dz = (z - b.z) / b.rz;
      if (dx*dx + dz*dz < 1) return true;
    }
    return false;
  }

  // ─── Blob shadow ─────────────────────────────────────────────────────────────
  function updateBlobShadow() {
    ballShadow.position.x = ball.position.x;
    ballShadow.position.z = ball.position.z;
    const gy = getGroundY(ball.position.x, ball.position.z);
    ballShadow.position.y = gy + 0.021;
    const h = Math.max(0, ball.position.y - BALL_RADIUS - gy);
    ballShadow.scale.setScalar(Math.max(0.12, 1.0 - h * 0.022));
    shadowMat.opacity = Math.max(0.03, 0.38 - h * 0.009);
  }

  // ─── Club logic ──────────────────────────────────────────────────────────────
  function isOnGreen() {
    const dx = ball.position.x - HOLE.green.x, dz = ball.position.z - HOLE.green.z;
    return Math.sqrt(dx*dx + dz*dz) < HOLE.green.radius;
  }
  function setClub(key) {
    if (!CLUBS[key] || (CLUBS[key].onGreenOnly && !isOnGreen())) return;
    currentClub = key; updateClubSelector();
  }
  function updateClubSelector() {
    const onGreen = isOnGreen();
    document.querySelectorAll('.club-btn').forEach(btn => {
      const k = btn.dataset.club;
      btn.classList.toggle('active',   k === currentClub);
      btn.classList.toggle('disabled', CLUBS[k].onGreenOnly && !onGreen);
    });
    if (currentClub === 'putter' && !onGreen) {
      currentClub = 'driver';
      document.querySelectorAll('.club-btn').forEach(b => b.classList.toggle('active', b.dataset.club === 'driver'));
    }
  }
  document.querySelectorAll('.club-btn').forEach(btn => {
    btn.addEventListener('click',     e => { e.stopPropagation(); setClub(btn.dataset.club); });
    btn.addEventListener('mousedown', e => e.stopPropagation());
    btn.addEventListener('mouseup',   e => e.stopPropagation());
  });

  // ─── Flash helpers ───────────────────────────────────────────────────────────
  function flashText(el, msg, duration) {
    el.textContent = msg;
    el.style.transition = 'none'; el.style.opacity = '1';
    setTimeout(() => { el.style.transition = 'opacity 0.9s'; el.style.opacity = '0'; }, duration || 1400);
  }

  function showStopped() {
    const dist = Math.round(Math.abs(ball.position.z) * 1.15);
    flashText(distText, dist + ' YDS', 5000);
    resetBtn.style.display = 'block';
    updateClubSelector();
    setTimeout(() => {
      if (state === 'stopped') { state = 'idle'; powerWrap.style.display = 'block'; }
    }, 1500);
  }

  // ─── Reset to tee ────────────────────────────────────────────────────────────
  function resetBallToTee() {
    ball.visible = true;
    ball.position.set(HOLE.tee.x, HOLE.tee.elevation + BALL_RADIUS + 0.115, HOLE.tee.z);
    ball.rotation.set(0, 0, 0); ball.scale.setScalar(1);
    vel.set(0, 0, 0); bounceCount = 0; aimAngle = 0;
    state = 'idle';
    if (teePeg) teePeg.visible = true;
    currentClub = 'driver';
    distText.style.transition = 'none'; distText.style.opacity = '0';
    resetBtn.style.display  = 'none';
    powerWrap.style.display = 'block';
    camCurrent.set(HOLE.tee.x, HOLE.tee.elevation + 3.5, HOLE.tee.z + 10);
    lookCurrent.set(HOLE.tee.x, HOLE.tee.elevation + 0.5, HOLE.tee.z - 10);
    updateClubSelector(); updateBlobShadow(); updateStrokeCounter();
    strokeCounterEl.style.display = 'block';
  }

  function reset() {
    if (state === 'sinking' || state === 'holed' || state === 'preview' || state === 'penalty') return;
    resetBallToTee();
  }

  // ─── Water penalty ───────────────────────────────────────────────────────────
  function waterPenalty() {
    state = 'penalty';
    vel.set(0, 0, 0);
    strokeCount++;
    updateStrokeCounter();
    powerWrap.style.display = 'none';
    resetBtn.style.display  = 'none';
    flashText(shotText, 'WATER  +1', 2000);
    setTimeout(resetBallToTee, 2100);
  }

  // ─── Input ───────────────────────────────────────────────────────────────────
  function startCharge() {
    if (state !== 'idle') return;
    state = 'charging'; chargeStart = performance.now() / 1000;
  }

  function releaseSwing() {
    if (state !== 'charging') return;
    const club    = CLUBS[currentClub];
    const elapsed = performance.now() / 1000 - chargeStart;
    const power   = Math.min(1, elapsed / club.maxTime);
    if (power < 0.04) { state = 'idle'; return; }
    const speed  = THREE.MathUtils.lerp(club.minSpeed, club.maxSpeed, power);
    const hSpeed = speed * Math.cos(club.angle);
    const vSpeed = speed * Math.sin(club.angle);
    vel.set(Math.sin(aimAngle) * hSpeed, vSpeed, -Math.cos(aimAngle) * hSpeed);
    flightAimAngle = aimAngle;
    strokeCount++; updateStrokeCounter();
    bounceCount = 0; state = 'flying';
    if (teePeg) teePeg.visible = false;
    powerWrap.style.display = 'none';
    flashText(shotText, 'FORE!', 700);
  }

  window.addEventListener('keydown', e => {
    keysHeld.add(e.code);
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'preview') { endPreview(); return; }
      if (!e.repeat) startCharge();
    }
    if (e.code === 'KeyR') reset();
    if (e.code === 'Digit1') setClub('driver');
    if (e.code === 'Digit2') setClub('iron');
    if (e.code === 'Digit3') setClub('wedge');
    if (e.code === 'Digit4') setClub('putter');
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keysHeld.delete(e.code); if (e.code === 'Space') releaseSwing(); });

  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (state === 'preview') { endPreview(); return; }
    isDraggingAim = false; aimDragLastX = e.clientX; startCharge();
  });
  window.addEventListener('mousemove', e => {
    if (!(e.buttons & 1) || (state !== 'idle' && state !== 'charging')) return;
    const dx = e.clientX - aimDragLastX;
    if (Math.abs(dx) > 3) {
      isDraggingAim = true;
      if (state === 'charging') state = 'idle';
      aimAngle = THREE.MathUtils.clamp(aimAngle + dx * 0.004, -Math.PI * 0.6, Math.PI * 0.6);
      aimDragLastX = e.clientX;
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    if (e.target.classList && e.target.classList.contains('club-btn')) return;
    if (!isDraggingAim) releaseSwing();
    isDraggingAim = false;
  });
  resetBtn.addEventListener('click', reset);

  // ─── Trajectory simulation ───────────────────────────────────────────────────
  function getTrajectoryPoints() {
    const club  = CLUBS[currentClub];
    const power = (state === 'charging') ? Math.min(1, (performance.now()/1000 - chargeStart) / club.maxTime) : 0.78;
    const speed  = THREE.MathUtils.lerp(club.minSpeed, club.maxSpeed, power);
    const hSpeed = speed * Math.cos(club.angle);
    const dirX = Math.sin(aimAngle), dirZ = -Math.cos(aimAngle);
    let px = ball.position.x, py = ball.position.y, pz = ball.position.z, pvy = speed * Math.sin(club.angle);
    const pts = [[px, py, pz]];
    for (let i = 0; i < ARC_CAP - 1; i++) {
      pvy += GRAVITY * 0.07; px += dirX * hSpeed * 0.07; py += pvy * 0.07; pz += dirZ * hSpeed * 0.07;
      const fy = getGroundY(px, pz) + BALL_RADIUS;
      if (py <= fy) { pts.push([px, fy, pz]); break; }
      pts.push([px, py, pz]);
    }
    return pts;
  }

  // ─── Aim visuals ─────────────────────────────────────────────────────────────
  function updateAimVisuals() {
    const vis = (state === 'idle' || state === 'charging');
    aimLine.visible = vis; aimArrowGroup.visible = vis; arcLine.visible = vis;
    if (!vis) { arcLineGeo.setDrawRange(0, 0); return; }
    const club = CLUBS[currentClub], lineLen = 5 + club.maxSpeed * 0.20;
    const dirX = Math.sin(aimAngle), dirZ = -Math.cos(aimAngle);
    const ap = aimLineGeo.attributes.position;
    for (let i = 0; i < AIM_PTS; i++) {
      const t = i / (AIM_PTS - 1);
      const wx = ball.position.x + dirX * t * lineLen, wz = ball.position.z + dirZ * t * lineLen;
      ap.setXYZ(i, wx, getGroundY(wx, wz) + 0.06, wz);
    }
    ap.needsUpdate = true; aimLine.computeLineDistances();
    const ex = ball.position.x + dirX * lineLen, ez = ball.position.z + dirZ * lineLen;
    aimArrowGroup.position.set(ex, getGroundY(ex, ez) + 0.22, ez);
    aimArrowGroup.rotation.y = -aimAngle;
    const pts = getTrajectoryPoints(), arcPos = arcLineGeo.attributes.position;
    const cnt = Math.min(pts.length, ARC_CAP);
    for (let i = 0; i < cnt; i++) arcPos.setXYZ(i, pts[i][0], pts[i][1] + 0.05, pts[i][2]);
    arcPos.needsUpdate = true; arcLineGeo.setDrawRange(0, cnt);
  }

  // ─── Cup collision ────────────────────────────────────────────────────────────
  function checkCupCollision() {
    const dx = ball.position.x - HOLE.flag.x, dz = ball.position.z - HOLE.flag.z;
    return Math.sqrt(dx*dx + dz*dz) < 0.27 && ball.position.y < HOLE.green.elevation + 0.8;
  }

  // ─── Physics ─────────────────────────────────────────────────────────────────
  function stepPhysics(dt) {
    if (state === 'sinking') {
      sinkTimer += dt;
      const p = Math.min(1, sinkTimer / 0.45);
      ball.position.y = sinkStartY - p * 0.6;
      ball.scale.setScalar(1 - p * 0.85);
      if (p >= 1) {
        ball.visible = false; ball.scale.setScalar(1);
        state = 'holed'; setTimeout(showScorecard, 350);
      }
      updateBlobShadow(); return;
    }
    if (state === 'penalty' || state === 'preview') return;
    if (state !== 'flying' && state !== 'rolling') return;

    if (state === 'flying') {
      vel.y += GRAVITY * dt;
      ball.position.addScaledVector(vel, dt);
      ball.rotation.x -= vel.z * dt * 3.5; ball.rotation.z += vel.x * dt * 3.5;
      const floorY = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;
      if (ball.position.y <= floorY) {
        ball.position.y = floorY;
        if (HOLE.checkWater(ball.position.x, ball.position.z)) { waterPenalty(); return; }
        if (checkCupCollision()) { holeBall(); return; }
        if (Math.abs(vel.y) > 1.8 && bounceCount < 3) {
          vel.y *= -BOUNCE_RESTITUTION; vel.x *= 0.80; vel.z *= 0.85; bounceCount++;
        } else { vel.y = 0; state = 'rolling'; }
      }
    }

    if (state === 'rolling') {
      if (HOLE.checkWater(ball.position.x, ball.position.z)) { waterPenalty(); return; }
      if (checkCupCollision()) { holeBall(); return; }
      ball.position.addScaledVector(vel, dt);
      ball.rotation.x -= vel.z * dt * 3.5; ball.rotation.z += vel.x * dt * 3.5;
      const fric = isInBunker(ball.position.x, ball.position.z) ? SAND_FRICTION : ROLL_FRICTION;
      const f = Math.pow(fric, dt * 60);
      vel.x *= f; vel.z *= f; vel.y = 0;
      ball.position.y = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;
      if (Math.sqrt(vel.x*vel.x + vel.z*vel.z) < STOP_SPEED) {
        if (isInBunker(ball.position.x, ball.position.z)) flashText(shotText, 'BUNKER', 1200);
        vel.set(0, 0, 0); state = 'stopped'; showStopped();
      }
    }
    updateBlobShadow();
  }

  // ─── Camera ──────────────────────────────────────────────────────────────────
  function updateCamera(dt, t) {
    if (state === 'preview') return; // handled by updatePreviewCamera
    let targetPos, targetLook, lerpK;

    if (state === 'idle' || state === 'charging') {
      const bob = Math.sin(t * 0.4) * 0.04;
      targetPos  = new THREE.Vector3(ball.position.x - Math.sin(aimAngle)*10, ball.position.y + 3.5 + bob, ball.position.z + Math.cos(aimAngle)*10);
      targetLook = new THREE.Vector3(ball.position.x + Math.sin(aimAngle)*8,  ball.position.y + 0.5, ball.position.z - Math.cos(aimAngle)*8);
      lerpK = 5;
    } else if (state === 'stopped' || state === 'penalty') {
      targetPos  = new THREE.Vector3(ball.position.x, ball.position.y + 3.2, ball.position.z + 10);
      targetLook = new THREE.Vector3(ball.position.x, ball.position.y + 0.3, ball.position.z - 12);
      lerpK = 1.5;
    } else if (state === 'sinking' || state === 'holed') {
      targetPos  = new THREE.Vector3(HOLE.flag.x + 3, HOLE.green.elevation + 4, HOLE.flag.z + 7);
      targetLook = new THREE.Vector3(HOLE.flag.x, HOLE.green.elevation + 0.3, HOLE.flag.z);
      lerpK = 2.5;
    } else {
      targetPos  = new THREE.Vector3(ball.position.x - Math.sin(flightAimAngle)*12, ball.position.y + 4.8, ball.position.z + Math.cos(flightAimAngle)*12);
      targetLook = new THREE.Vector3(ball.position.x + Math.sin(flightAimAngle)*18, ball.position.y - 0.5, ball.position.z - Math.cos(flightAimAngle)*18);
      lerpK = 4.5;
    }
    camCurrent.lerp(targetPos, dt * lerpK);
    lookCurrent.lerp(targetLook, dt * lerpK);
    camera.position.copy(camCurrent);
    camera.lookAt(lookCurrent);
  }

  // ─── Power bar & aiming ───────────────────────────────────────────────────────
  function updatePowerBar() {
    const club = CLUBS[currentClub];
    if (state === 'charging') powerFill.style.width = Math.min(100, (performance.now()/1000 - chargeStart) / club.maxTime * 100) + '%';
    else if (state === 'idle') powerFill.style.width = '0%';
  }
  function updateAiming(dt) {
    if (state !== 'idle' && state !== 'charging') return;
    const S = 1.6;
    if (keysHeld.has('ArrowLeft'))  aimAngle -= S * dt;
    if (keysHeld.has('ArrowRight')) aimAngle += S * dt;
    aimAngle = THREE.MathUtils.clamp(aimAngle, -Math.PI * 0.6, Math.PI * 0.6);
  }

  // ─── Scoring helpers ─────────────────────────────────────────────────────────
  function getDiffLabel(s, par) {
    const d = s - par;
    if (s === 1)  return 'HOLE IN ONE!';
    if (d <= -2)  return 'EAGLE';
    if (d === -1) return 'BIRDIE';
    if (d ===  0) return 'PAR';
    if (d ===  1) return 'BOGEY';
    if (d ===  2) return 'DOUBLE BOGEY';
    return '+' + d;
  }
  function diffClass(s, par) {
    const d = s - par;
    if (s === 1 || d <= -2) return 'sc-eagle';
    if (d === -1) return 'sc-birdie';
    if (d ===  0) return 'sc-par';
    if (d ===  1) return 'sc-bogey';
    if (d ===  2) return 'sc-double';
    return 'sc-worse';
  }
  function formatDiff(d) { return d === 0 ? 'E' : (d > 0 ? '+' : '') + d; }
  function updateStrokeCounter() { strokeCounterEl.textContent = strokeCount > 0 ? 'STROKES: ' + strokeCount : ''; }
  function updateHUD() {
    const h = COURSE[currentHoleIdx];
    document.querySelector('#hud h1').textContent = h.name;
    document.querySelector('#hud p').textContent  = 'HOLE ' + (currentHoleIdx+1) + '  ·  PAR ' + h.par + '  ·  ' + h.yardage + ' YDS';
  }
  function updateMinimapLabel() { document.getElementById('minimap-label').textContent = 'HOLE ' + (currentHoleIdx+1); }

  // ─── Particles ───────────────────────────────────────────────────────────────
  function triggerParticles() {
    const cx = HOLE.flag.x, cy = HOLE.green.elevation, cz = HOLE.flag.z;
    for (let i = 0; i < N_PARTICLES; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
      partVelArr[i].set(Math.cos(a)*s*0.7, 3+Math.random()*9, Math.sin(a)*s*0.7);
      partPosBuf[i*3] = cx; partPosBuf[i*3+1] = cy; partPosBuf[i*3+2] = cz;
      const c = new THREE.Color().setHSL(Math.random(), 1.0, 0.60);
      partColBuf[i*3] = c.r; partColBuf[i*3+1] = c.g; partColBuf[i*3+2] = c.b;
    }
    partGeo.attributes.position.needsUpdate = true;
    partGeo.attributes.color.needsUpdate    = true;
    partActive = true; partTime = 0;
    particles.visible = true; partMat.opacity = 1.0;
  }
  function updateParticles(dt) {
    if (!partActive) return;
    partTime += dt;
    if (partTime > PART_LIFE) { partActive = false; particles.visible = false; return; }
    partMat.opacity = Math.min(1, Math.max(0, 1 - (partTime - (PART_LIFE - 0.8)) / 0.8));
    for (let i = 0; i < N_PARTICLES; i++) {
      partVelArr[i].y += GRAVITY * 0.45 * dt;
      partPosBuf[i*3]   += partVelArr[i].x * dt;
      partPosBuf[i*3+1] += partVelArr[i].y * dt;
      partPosBuf[i*3+2] += partVelArr[i].z * dt;
      if (partPosBuf[i*3+1] < HOLE.green.elevation + 0.05) {
        partPosBuf[i*3+1] = HOLE.green.elevation + 0.05; partVelArr[i].y *= -0.3;
      }
    }
    partGeo.attributes.position.needsUpdate = true;
  }

  // ─── Hole-in logic ────────────────────────────────────────────────────────────
  function holeBall() {
    scores[currentHoleIdx] = strokeCount;
    sinkStartY = ball.position.y; sinkTimer = 0;
    state = 'sinking'; vel.set(0, 0, 0);
    powerWrap.style.display = 'none'; resetBtn.style.display = 'none';
    triggerParticles();
    flashText(shotText, getDiffLabel(strokeCount, COURSE[currentHoleIdx].par), 2200);
  }

  function showScorecard() {
    const tbody = document.getElementById('scorecard-body');
    const tfoot = document.getElementById('scorecard-foot');
    tbody.innerHTML = '';
    let totalPar = 0, totalStrokes = 0;
    for (let i = 0; i < COURSE.length; i++) {
      const h = COURSE[i], s = scores[i];
      const tr = document.createElement('tr');
      totalPar += h.par;
      if (s !== undefined) {
        totalStrokes += s; tr.className = diffClass(s, h.par);
        tr.innerHTML = '<td>'+(i+1)+'</td><td>'+h.par+'</td><td>'+h.yardage+'</td><td>'+s+'</td><td>'+formatDiff(s-h.par)+'</td>';
      } else {
        tr.className = 'sc-future';
        tr.innerHTML = '<td>'+(i+1)+'</td><td>'+h.par+'</td><td>'+h.yardage+'</td><td>-</td><td></td>';
      }
      tbody.appendChild(tr);
    }
    const isLast = currentHoleIdx >= COURSE.length - 1;
    tfoot.innerHTML = '<tr class="sc-total"><td colspan="3">TOTAL</td><td>'+(totalStrokes||'-')+'</td><td>'+(scores.length>0?formatDiff(totalStrokes-totalPar):'')+'</td></tr>';
    document.getElementById('scorecard-title').textContent = isLast ? 'ROUND COMPLETE' : 'HOLE '+(currentHoleIdx+1)+' COMPLETE';
    document.getElementById('next-hole-btn').style.display  = isLast ? 'none' : 'inline-block';
    document.getElementById('play-again-btn').style.display = isLast ? 'inline-block' : 'none';
    document.getElementById('scorecard-overlay').style.display = 'flex';
    strokeCounterEl.style.display = 'none';
  }
  function hideScorecard() { document.getElementById('scorecard-overlay').style.display = 'none'; }

  function advanceHole() {
    hideScorecard();
    currentHoleIdx++;
    strokeCount = 0;
    buildHole(currentHoleIdx);
    updateHUD(); updateMinimapLabel();
  }
  function startNewRound() {
    hideScorecard();
    currentHoleIdx = 0; strokeCount = 0; scores.length = 0;
    buildHole(0);
    updateHUD(); updateMinimapLabel();
  }
  document.getElementById('next-hole-btn').addEventListener('click',  advanceHole);
  document.getElementById('play-again-btn').addEventListener('click', startNewRound);

  // ─── Mini-map ────────────────────────────────────────────────────────────────
  function wmX(wx) { return (wx - HOLE.mm.xMin) / HOLE.mm.xRange * 120; }
  function wmZ(wz) { return (HOLE.mm.zMax - wz) / HOLE.mm.zRange * 160; }

  function drawMinimap() {
    mmCtx.clearRect(0, 0, 120, 160);

    // Background (ocean for island green, dark green otherwise)
    mmCtx.fillStyle = HOLE.islandGreen ? 'rgba(18,55,115,0.92)' : 'rgba(20,40,20,0.88)';
    mmCtx.fillRect(0, 0, 120, 160);

    // Water rectangles
    mmCtx.fillStyle = 'rgba(30,95,200,0.82)';
    for (const wz of HOLE.waterRects) {
      const wx0 = wmX(wz.x - wz.w/2), wz0 = wmZ(wz.z + wz.d/2);
      const ww  = wz.w / HOLE.mm.xRange * 120, wd = wz.d / HOLE.mm.zRange * 160;
      mmCtx.fillRect(wx0, wz0, ww, wd);
    }

    // Rough flanking for straight segments
    mmCtx.fillStyle = '#2d5a2d';
    for (const seg of HOLE.fairwaySegs) {
      if (seg.ry !== 0) continue; // skip dogleg segs (handled separately)
      const fw = seg.w / 2, rf = HOLE.rough.flanking;
      if (rf <= 0) continue;
      const segTop = wmZ(seg.z + seg.len/2), segH = seg.len / HOLE.mm.zRange * 160;
      const lx = wmX(seg.x - fw - rf), rw = wmX(seg.x + fw) - wmX(seg.x + fw - rf);
      mmCtx.fillRect(wmX(seg.x - fw - rf), segTop, wmX(seg.x - fw) - wmX(seg.x - fw - rf), segH);
      mmCtx.fillRect(wmX(seg.x + fw),      segTop, wmX(seg.x + fw + rf) - wmX(seg.x + fw), segH);
    }

    // Fairway segments
    mmCtx.fillStyle = '#4a9e4a';
    for (const seg of HOLE.fairwaySegs) {
      const mcx = wmX(seg.x), mcz = wmZ(seg.z);
      const mw  = seg.w   / HOLE.mm.xRange * 120;
      const ml  = seg.len / HOLE.mm.zRange * 160;
      mmCtx.save();
      mmCtx.translate(mcx, mcz);
      mmCtx.rotate(-seg.ry);  // minimap: CCW world Y rot = CCW canvas rot
      mmCtx.fillRect(-mw/2, -ml/2, mw, ml);
      mmCtx.restore();
    }

    // Bunkers
    mmCtx.fillStyle = '#d4b870';
    for (const b of HOLE.bunkers) {
      const brx = b.rx / HOLE.mm.xRange * 120, brz = b.rz / HOLE.mm.zRange * 160;
      mmCtx.save();
      mmCtx.translate(wmX(b.x), wmZ(b.z));
      mmCtx.scale(1, brz / brx);
      mmCtx.beginPath(); mmCtx.arc(0, 0, brx, 0, Math.PI*2); mmCtx.fill();
      mmCtx.restore();
    }

    // Green circle
    const grx = HOLE.green.radius / HOLE.mm.xRange * 120;
    const grz = HOLE.green.radius / HOLE.mm.zRange * 160;
    mmCtx.save();
    mmCtx.translate(wmX(HOLE.green.x), wmZ(HOLE.green.z));
    mmCtx.scale(1, grz / grx);
    mmCtx.beginPath(); mmCtx.arc(0, 0, grx, 0, Math.PI*2);
    mmCtx.fillStyle = '#5dbf5d'; mmCtx.fill();
    mmCtx.restore();

    // Tee marker
    mmCtx.fillStyle = '#7de07d';
    mmCtx.fillRect(wmX(HOLE.tee.x) - 2, wmZ(HOLE.tee.z) - 2, 4, 4);

    // Flag
    mmCtx.beginPath();
    mmCtx.arc(wmX(HOLE.flag.x), wmZ(HOLE.flag.z), 2, 0, Math.PI*2);
    mmCtx.fillStyle = '#ffffff'; mmCtx.fill();

    // Aim prediction line (idle/charging)
    if (state === 'idle' || state === 'charging') {
      const pts  = getTrajectoryPoints();
      const land = pts[pts.length - 1];
      const bx   = wmX(ball.position.x), bz = wmZ(ball.position.z);
      const ex   = wmX(land[0]),         ez = wmZ(land[2]);
      mmCtx.save();
      mmCtx.setLineDash([3, 3]);
      mmCtx.strokeStyle = 'rgba(255,218,40,0.85)'; mmCtx.lineWidth = 1.5;
      mmCtx.beginPath(); mmCtx.moveTo(bx, bz); mmCtx.lineTo(ex, ez); mmCtx.stroke();
      mmCtx.restore();
      mmCtx.beginPath();
      mmCtx.arc(ex, ez, 3, 0, Math.PI*2);
      mmCtx.fillStyle = 'rgba(255,218,40,0.80)'; mmCtx.fill();
    }

    // Ball dot
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x)+1, wmZ(ball.position.z)+1, 3.5, 0, Math.PI*2);
    mmCtx.fillStyle = 'rgba(0,0,0,0.45)'; mmCtx.fill();
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x), wmZ(ball.position.z), 4, 0, Math.PI*2);
    mmCtx.fillStyle = 'rgba(255,255,255,0.95)'; mmCtx.fill();

    // T / G labels
    mmCtx.fillStyle = 'rgba(255,255,255,0.38)'; mmCtx.font = '8px Georgia';
    mmCtx.fillText('T', wmX(HOLE.tee.x + 2.5), wmZ(HOLE.tee.z - 2));
    mmCtx.fillText('G', wmX(HOLE.green.x + HOLE.green.radius + 0.5), wmZ(HOLE.green.z));
  }

  // ─── Main loop ────────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    if (state === 'preview') {
      previewT += dt / PREVIEW_DURATION;
      if (previewT >= 1) endPreview();
      else               updatePreviewCamera(previewT);
    } else {
      updateAiming(dt);
      stepPhysics(dt);
      updateCamera(dt, t);
      updatePowerBar();
      updateAimVisuals();
    }
    updateParticles(dt);

    if (flagMesh) {
      flagMesh.rotation.y = Math.sin(t * 2.5) * 0.15;
      flagMesh.position.x = HOLE.flag.x + 0.6 + Math.sin(t * 2.5) * 0.08;
    }

    drawMinimap();
    renderer.render(scene, camera);
  }

  // ─── Kick off ────────────────────────────────────────────────────────────────
  buildHole(0);
  updateHUD();
  animate();
  </script>
</body>
</html>
