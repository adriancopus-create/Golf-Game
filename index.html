<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Golf Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Georgia', serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-align: center;
      pointer-events: none;
    }
    #hud h1 { font-size: 28px; letter-spacing: 3px; font-weight: normal; }
    #hud p  { font-size: 13px; margin-top: 4px; opacity: 0.75; letter-spacing: 1px; }

    /* ── Power meter ─────────────────────────────────────────────────── */
    #power-wrap {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      user-select: none;
    }
    #power-label {
      color: #fff;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 7px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    #power-bar-bg {
      width: 240px;
      height: 15px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
    }
    #power-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #4ee04e 0%, #f5d020 55%, #e83030 100%);
      border-radius: 8px;
      transition: width 0.05s linear;
    }
    #power-hint {
      color: rgba(255,255,255,0.6);
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 7px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ── Overlay texts ───────────────────────────────────────────────── */
    #shot-text {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: Georgia, serif;
      font-size: 38px;
      letter-spacing: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      pointer-events: none;
      opacity: 0;
    }
    #dist-text {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffe066;
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      pointer-events: none;
      opacity: 0;
    }

    /* ── Reset button ────────────────────────────────────────────────── */
    #reset-btn {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      cursor: pointer;
      padding: 9px 26px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      background: rgba(0,0,0,0.35);
      display: none;
    }
    #reset-btn:hover { background: rgba(255,255,255,0.12); }

    /* ── Mini-map ────────────────────────────────────────────────────── */
    #minimap-wrap {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: none;
      user-select: none;
    }
    #minimap-label {
      color: rgba(255,255,255,0.8);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #minimap {
      display: block;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h1>GOLF</h1>
    <p>HOLE 1 &nbsp;|&nbsp; PAR 3 &nbsp;|&nbsp; 155 YDS</p>
  </div>

  <div id="power-wrap">
    <div id="power-label">POWER</div>
    <div id="power-bar-bg"><div id="power-bar-fill"></div></div>
    <div id="power-hint">HOLD SPACE OR CLICK &nbsp;·&nbsp; RELEASE TO SWING</div>
  </div>

  <div id="shot-text">FORE!</div>
  <div id="dist-text"></div>
  <button id="reset-btn">&#8635;&nbsp; RESET (R)</button>

  <div id="minimap-wrap">
    <div id="minimap-label">HOLE 1</div>
    <canvas id="minimap" width="120" height="160"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ─── Physics constants ────────────────────────────────────────────────────────
  const BALL_RADIUS        = 0.215;
  const GRAVITY            = -22;
  const BOUNCE_RESTITUTION = 0.38;
  const ROLL_FRICTION      = 0.963;
  const STOP_SPEED         = 0.10;
  const MAX_POWER_TIME     = 2.2;
  const MIN_LAUNCH_SPEED   = 16;
  const MAX_LAUNCH_SPEED   = 74;
  const TEE_HEIGHT         = BALL_RADIUS + 0.115;

  // ─── Hole layout data ─────────────────────────────────────────────────────────
  const HOLE = {
    par: 3,
    yardage: 155,
    tee:     { x: 0, z: 0, width: 5, depth: 3 },
    fairway: { x: 0, centerZ: -65, width: 24, length: 130 },
    green:   { x: 0, z: -130, radius: 9, elevation: 0.7 },
    flag:    { x: 0, z: -130, color: 0xee4422 },
    rough:   { flanking: 22 },
  };

  // ─── Game state ───────────────────────────────────────────────────────────────
  let state       = 'idle';
  let chargeStart = 0;
  let bounceCount = 0;
  const vel = new THREE.Vector3();

  const camCurrent  = new THREE.Vector3(0, 3.5, 10);
  const lookCurrent = new THREE.Vector3(0, 0.5, -10);

  // ─── Renderer ────────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // ─── Scene ───────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();

  // ─── Sky gradient sphere ──────────────────────────────────────────────────────
  const skyGeo = new THREE.SphereGeometry(500, 32, 32);
  skyGeo.deleteAttribute('normal');
  skyGeo.deleteAttribute('uv');

  const topColor     = new THREE.Color(0x1a6ebe);
  const horizonColor = new THREE.Color(0x9ecfe8);
  const bottomColor  = new THREE.Color(0x7ab87a);
  const skyColors    = [];
  const posArr       = skyGeo.attributes.position;

  for (let i = 0; i < posArr.count; i++) {
    const t = THREE.MathUtils.clamp((posArr.getY(i) + 500) / 1000, 0, 1);
    const c = new THREE.Color();
    if (t < 0.15) c.lerpColors(bottomColor, horizonColor, t / 0.15);
    else           c.lerpColors(horizonColor, topColor, (t - 0.15) / 0.85);
    skyColors.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));
  scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));

  // ─── Lighting ────────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));

  const sun = new THREE.DirectionalLight(0xfff8d6, 1.4);
  sun.position.set(80, 120, 60);
  sun.castShadow = true;
  sun.shadow.camera.left   = -100;
  sun.shadow.camera.right  =  100;
  sun.shadow.camera.top    =  100;
  sun.shadow.camera.bottom = -100;
  sun.shadow.camera.near   =  0.5;
  sun.shadow.camera.far    =  400;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0003;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xb0d8ff, 0.35);
  fill.position.set(-60, 40, -40);
  scene.add(fill);

  // ─── Procedural grass texture ─────────────────────────────────────────────────
  function buildGrassTexture(size) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');

    function hash(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      const a = hash(ix,   iy), b = hash(ix+1, iy);
      const c = hash(ix,   iy+1), d = hash(ix+1, iy+1);
      return a + (b-a)*ux + (c-a)*uy + (b-a+a-b-c+d)*ux*uy;
    }
    function fbm(x, y) {
      let v = 0, amp = 0.5, freq = 1;
      for (let o = 0; o < 5; o++) { v += amp * noise(x*freq, y*freq); amp *= 0.5; freq *= 2.1; }
      return v;
    }

    const img = ctx.createImageData(size, size);
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const n = fbm(px / size * 8, py / size * 8);
        const b = 0.30 + n * 0.45;
        const i = (py * size + px) * 4;
        img.data[i]   = Math.round(b * 62);
        img.data[i+1] = Math.round(b * 130);
        img.data[i+2] = Math.round(b * 55);
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 20);  // tuned for 24×130 fairway strip
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // ─── Fairway strip ───────────────────────────────────────────────────────────
  const grassTex = buildGrassTexture(512);

  const fairway = new THREE.Mesh(
    new THREE.PlaneGeometry(HOLE.fairway.width, HOLE.fairway.length),
    new THREE.MeshLambertMaterial({ map: grassTex })
  );
  fairway.rotation.x = -Math.PI / 2;
  fairway.position.set(HOLE.fairway.x, 0, HOLE.fairway.centerZ);
  fairway.receiveShadow = true;
  scene.add(fairway);

  // ─── Rough (flanking strips) ─────────────────────────────────────────────────
  const roughMat = new THREE.MeshLambertMaterial({ color: 0x2d6a2d });
  [-1, 1].forEach(side => {
    const roughX = side * (HOLE.fairway.width / 2 + HOLE.rough.flanking / 2);
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(HOLE.rough.flanking, HOLE.fairway.length),
      roughMat
    );
    strip.rotation.x = -Math.PI / 2;
    strip.position.set(roughX, -0.01, HOLE.fairway.centerZ);
    strip.receiveShadow = true;
    scene.add(strip);
  });

  // Large backdrop for ground continuity behind the green
  const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshLambertMaterial({ color: 0x2d6a2d })
  );
  backdrop.rotation.x = -Math.PI / 2;
  backdrop.position.set(0, -0.02, -195);
  backdrop.receiveShadow = true;
  scene.add(backdrop);

  // ─── Tee box ─────────────────────────────────────────────────────────────────
  const teeBox = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 4),
    new THREE.MeshLambertMaterial({ color: 0x5db85d })
  );
  teeBox.rotation.x = -Math.PI / 2;
  teeBox.position.set(0, 0.01, 0);
  teeBox.receiveShadow = true;
  scene.add(teeBox);

  // ─── Tee peg ─────────────────────────────────────────────────────────────────
  const teePeg = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.025, 0.22, 8),
    new THREE.MeshLambertMaterial({ color: 0xf5c842 })
  );
  teePeg.position.set(0, 0.11, 0);
  teePeg.castShadow = true;
  scene.add(teePeg);

  // ─── Green ───────────────────────────────────────────────────────────────────
  // Mound: CylinderGeometry top = green.radius, base slightly wider, positioned
  // so top face lands exactly at y = green.elevation.
  const moundHeight = HOLE.green.elevation + 0.3;
  const mound = new THREE.Mesh(
    new THREE.CylinderGeometry(HOLE.green.radius, HOLE.green.radius + 2.5, moundHeight, 32),
    new THREE.MeshLambertMaterial({ color: 0x4a9e4a })
  );
  mound.position.set(HOLE.green.x, HOLE.green.elevation - moundHeight / 2, HOLE.green.z);
  mound.receiveShadow = true;
  scene.add(mound);

  // Green surface: +0.001 above mound top to prevent Z-fighting
  const greenSurface = new THREE.Mesh(
    new THREE.CircleGeometry(HOLE.green.radius, 32),
    new THREE.MeshLambertMaterial({ color: 0x5dbf5d })
  );
  greenSurface.rotation.x = -Math.PI / 2;
  greenSurface.position.set(HOLE.green.x, HOLE.green.elevation + 0.001, HOLE.green.z);
  greenSurface.receiveShadow = true;
  scene.add(greenSurface);

  // ─── 3D hole cup ─────────────────────────────────────────────────────────────
  // White metal rim ring lying flat on the green surface
  const cupRim = new THREE.Mesh(
    new THREE.TorusGeometry(0.28, 0.04, 8, 32),
    new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
  );
  cupRim.rotation.x = Math.PI / 2;   // lay flat (torus defaults to vertical)
  cupRim.position.set(HOLE.flag.x, HOLE.green.elevation + 0.022, HOLE.flag.z);
  scene.add(cupRim);

  // Black cylinder body sunk below the green surface
  const cupBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.27, 0.27, 0.5, 16),
    new THREE.MeshBasicMaterial({ color: 0x111111 })
  );
  // Center at elevation - 0.25 → top face flush with green, bottom 0.5 units down
  cupBody.position.set(HOLE.flag.x, HOLE.green.elevation - 0.25, HOLE.flag.z);
  scene.add(cupBody);

  // ─── Flagstick ────────────────────────────────────────────────────────────────
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 5.5, 8),
    new THREE.MeshLambertMaterial({ color: 0xdddddd })
  );
  pole.position.set(HOLE.flag.x, HOLE.green.elevation + 2.75, HOLE.flag.z);
  pole.castShadow = true;
  scene.add(pole);

  // Flag panel — offset half its width from pole centre so it hangs to one side
  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 0.8),
    new THREE.MeshLambertMaterial({ color: HOLE.flag.color, side: THREE.DoubleSide })
  );
  flag.position.set(HOLE.flag.x + 0.6, HOLE.green.elevation + 5.1, HOLE.flag.z);
  scene.add(flag);

  // ─── Golf ball ───────────────────────────────────────────────────────────────
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 32, 32),
    new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xaaaaaa, shininess: 120 })
  );
  ball.position.set(0, TEE_HEIGHT, 0);
  ball.castShadow = true;
  scene.add(ball);

  // ─── Ball blob shadow ─────────────────────────────────────────────────────────
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.38,
    depthWrite: false,
  });
  const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), shadowMat);
  ballShadow.rotation.x = -Math.PI / 2;
  ballShadow.position.y = 0.021;
  scene.add(ballShadow);

  // ─── Horizon hills ───────────────────────────────────────────────────────────
  function addHills(z, w, h, color) {
    const geo = new THREE.CylinderGeometry(0, w * 0.5, h, 6);
    const mat = new THREE.MeshLambertMaterial({ color });
    for (let x = -200; x <= 200; x += 55 + Math.random() * 30) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, h * 0.5 - 0.5, z);
      scene.add(m);
    }
  }
  // Moved closer so they sit naturally behind the par-3 green at z=-130
  addHills(-210, 120, 18, 0x2d7a2d);
  addHills(-195,  90, 12, 0x3a8c3a);
  addHills(-185,  70,  8, 0x4a9e4a);

  // ─── Camera ──────────────────────────────────────────────────────────────────
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(camCurrent);
  camera.lookAt(lookCurrent);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─── UI elements ─────────────────────────────────────────────────────────────
  const powerWrap = document.getElementById('power-wrap');
  const powerFill = document.getElementById('power-bar-fill');
  const shotText  = document.getElementById('shot-text');
  const distText  = document.getElementById('dist-text');
  const resetBtn  = document.getElementById('reset-btn');

  // ─── Mini-map canvas context (cached once) ────────────────────────────────────
  const mmCanvas = document.getElementById('minimap');
  const mmCtx    = mmCanvas.getContext('2d');

  function flashText(el, msg, duration = 1400) {
    el.textContent = msg;
    el.style.transition = 'none';
    el.style.opacity    = '1';
    setTimeout(() => {
      el.style.transition = 'opacity 0.9s';
      el.style.opacity    = '0';
    }, duration);
  }

  function showStopped() {
    const dist = Math.round(Math.abs(ball.position.z) * 1.15);
    flashText(distText, dist + ' YDS', 5000);
    resetBtn.style.display = 'block';
  }

  function reset() {
    ball.position.set(0, TEE_HEIGHT, 0);
    ball.rotation.set(0, 0, 0);
    vel.set(0, 0, 0);
    bounceCount = 0;
    state = 'idle';
    teePeg.visible = true;

    distText.style.transition = 'none';
    distText.style.opacity    = '0';
    resetBtn.style.display    = 'none';
    powerWrap.style.display   = 'block';

    camCurrent.set(0, 3.5, 10);
    lookCurrent.set(0, 0.5, -10);

    updateBlobShadow();
  }

  // ─── Input ───────────────────────────────────────────────────────────────────
  function startCharge() {
    if (state !== 'idle') return;
    state       = 'charging';
    chargeStart = performance.now() / 1000;
  }

  function releaseSwing() {
    if (state !== 'charging') return;

    const elapsed = performance.now() / 1000 - chargeStart;
    const power   = Math.min(1, elapsed / MAX_POWER_TIME);

    if (power < 0.04) { state = 'idle'; return; }

    const speed = THREE.MathUtils.lerp(MIN_LAUNCH_SPEED, MAX_LAUNCH_SPEED, power);
    const angle = THREE.MathUtils.lerp(0.54, 0.48, power);
    vel.set(0, speed * Math.sin(angle), -speed * Math.cos(angle));

    bounceCount = 0;
    state       = 'flying';

    teePeg.visible = false;
    powerWrap.style.display = 'none';
    flashText(shotText, 'FORE!', 700);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startCharge(); }
    if (e.code === 'KeyR') reset();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') releaseSwing();
  });
  renderer.domElement.addEventListener('mousedown', e => { if (e.button === 0) startCharge(); });
  window.addEventListener('mouseup', e => { if (e.button === 0) releaseSwing(); });
  resetBtn.addEventListener('click', reset);

  // ─── Ground elevation helper ──────────────────────────────────────────────────
  // Returns the y-coordinate of the ground surface at (x, z).
  // Uses a slightly shrunk radius so the ball doesn't snap up at the visible rim edge.
  function getGroundY(x, z) {
    const dx = x - HOLE.green.x;
    const dz = z - HOLE.green.z;
    if (Math.sqrt(dx * dx + dz * dz) < HOLE.green.radius - 0.3) {
      return HOLE.green.elevation;
    }
    return 0;
  }

  // ─── Blob shadow helper ───────────────────────────────────────────────────────
  function updateBlobShadow() {
    ballShadow.position.x = ball.position.x;
    ballShadow.position.z = ball.position.z;
    ballShadow.position.y = getGroundY(ball.position.x, ball.position.z) + 0.021;
    const height  = Math.max(0, ball.position.y - BALL_RADIUS - getGroundY(ball.position.x, ball.position.z));
    const scale   = Math.max(0.12, 1.0 - height * 0.022);
    const opacity = Math.max(0.03, 0.38 - height * 0.009);
    ballShadow.scale.setScalar(scale);
    shadowMat.opacity = opacity;
  }

  // ─── Physics step ─────────────────────────────────────────────────────────────
  function stepPhysics(dt) {
    if (state !== 'flying' && state !== 'rolling') return;

    if (state === 'flying') {
      vel.y += GRAVITY * dt;
      ball.position.addScaledVector(vel, dt);
      ball.rotation.x -= vel.z * dt * 3.5;

      const floorY = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;
      if (ball.position.y <= floorY) {
        ball.position.y = floorY;
        if (Math.abs(vel.y) > 1.8 && bounceCount < 3) {
          vel.y *= -BOUNCE_RESTITUTION;
          vel.z *=  0.85;
          vel.x *=  0.80;
          bounceCount++;
        } else {
          vel.y = 0;
          state = 'rolling';
        }
      }
    }

    if (state === 'rolling') {
      ball.position.addScaledVector(vel, dt);
      ball.rotation.x -= vel.z * dt * 3.5;

      const friction = Math.pow(ROLL_FRICTION, dt * 60);
      vel.x *= friction;
      vel.z *= friction;
      vel.y  = 0;
      ball.position.y = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;

      if (Math.sqrt(vel.x * vel.x + vel.z * vel.z) < STOP_SPEED) {
        vel.set(0, 0, 0);
        state = 'stopped';
        showStopped();
      }
    }

    updateBlobShadow();
  }

  // ─── Camera follow ────────────────────────────────────────────────────────────
  function updateCamera(dt, t) {
    let targetPos, targetLook, lerpK;

    if (state === 'idle' || state === 'charging') {
      const bob = Math.sin(t * 0.4) * 0.04;
      targetPos  = new THREE.Vector3(0, 3.5 + bob, 10);
      targetLook = new THREE.Vector3(0, 0.5, -10);
      lerpK = 3;
    } else if (state === 'stopped') {
      targetPos  = new THREE.Vector3(ball.position.x, ball.position.y + 3.2, ball.position.z + 10);
      targetLook = new THREE.Vector3(ball.position.x, ball.position.y + 0.3, ball.position.z - 12);
      lerpK = 1.5;
    } else {
      targetPos  = new THREE.Vector3(ball.position.x, ball.position.y + 4.8, ball.position.z + 12);
      targetLook = new THREE.Vector3(ball.position.x, ball.position.y - 0.5, ball.position.z - 18);
      lerpK = 4.5;
    }

    camCurrent.lerp(targetPos, dt * lerpK);
    lookCurrent.lerp(targetLook, dt * lerpK);
    camera.position.copy(camCurrent);
    camera.lookAt(lookCurrent);
  }

  // ─── Power bar ───────────────────────────────────────────────────────────────
  function updatePowerBar() {
    if (state === 'charging') {
      const elapsed = performance.now() / 1000 - chargeStart;
      powerFill.style.width = Math.min(100, (elapsed / MAX_POWER_TIME) * 100) + '%';
    } else if (state === 'idle') {
      powerFill.style.width = '0%';
    }
  }

  // ─── Mini-map coordinate mapping ──────────────────────────────────────────────
  // World x: -40..+40  → canvas 0..120
  // World z: +8..-148  → canvas 0..160  (tee near top, green near bottom)
  function wmX(wx) { return (wx + 40) / 80 * 120; }
  function wmZ(wz) { return (-wz + 8) / 156 * 160; }

  function drawMinimap() {
    mmCtx.clearRect(0, 0, 120, 160);

    // Background
    mmCtx.fillStyle = 'rgba(20,40,20,0.88)';
    mmCtx.fillRect(0, 0, 120, 160);

    // Pre-compute fairway rect bounds (tee end = top, green end = bottom)
    const fwHalfW = HOLE.fairway.width / 2;
    const fwLX   = wmX(-fwHalfW);
    const fwRX   = wmX( fwHalfW);
    const fwTopY = wmZ(HOLE.fairway.centerZ + HOLE.fairway.length / 2); // near tee → small Y
    const fwBotY = wmZ(HOLE.fairway.centerZ - HOLE.fairway.length / 2); // near green → large Y
    const fwW    = fwRX - fwLX;
    const fwH    = fwBotY - fwTopY;

    // Rough strips
    mmCtx.fillStyle = '#2d5a2d';
    mmCtx.fillRect(wmX(-fwHalfW - HOLE.rough.flanking), fwTopY,
                   wmX(-fwHalfW) - wmX(-fwHalfW - HOLE.rough.flanking), fwH);
    mmCtx.fillRect(fwRX, fwTopY,
                   wmX(fwHalfW + HOLE.rough.flanking) - fwRX, fwH);

    // Fairway
    mmCtx.fillStyle = '#4a9e4a';
    mmCtx.fillRect(fwLX, fwTopY, fwW, fwH);

    // Green circle
    const greenPxR = HOLE.green.radius / 80 * 120;
    mmCtx.beginPath();
    mmCtx.arc(wmX(HOLE.green.x), wmZ(HOLE.green.z), greenPxR, 0, Math.PI * 2);
    mmCtx.fillStyle = '#5dbf5d';
    mmCtx.fill();

    // Tee marker
    mmCtx.fillStyle = '#7de07d';
    mmCtx.fillRect(wmX(-1.5), wmZ(1.5), 3, 3);

    // Flag pin (small white circle)
    mmCtx.beginPath();
    mmCtx.arc(wmX(HOLE.flag.x), wmZ(HOLE.flag.z), 2, 0, Math.PI * 2);
    mmCtx.fillStyle = '#ffffff';
    mmCtx.fill();

    // Ball drop-shadow
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x) + 1, wmZ(ball.position.z) + 1, 3.5, 0, Math.PI * 2);
    mmCtx.fillStyle = 'rgba(0,0,0,0.45)';
    mmCtx.fill();

    // Ball dot (always on top)
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x), wmZ(ball.position.z), 4, 0, Math.PI * 2);
    mmCtx.fillStyle = 'rgba(255,255,255,0.95)';
    mmCtx.fill();

    // Labels
    mmCtx.fillStyle = 'rgba(255,255,255,0.45)';
    mmCtx.font = '8px Georgia';
    mmCtx.fillText('T', wmX(2.5), wmZ(-2));
    mmCtx.fillText('G', wmX(HOLE.green.x + HOLE.green.radius + 0.5), wmZ(HOLE.green.z));
  }

  // ─── Main loop ────────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    stepPhysics(dt);
    updateCamera(dt, t);
    updatePowerBar();

    // Flag wave — base x = flag.x + 0.6 (half of 1.2-wide PlaneGeometry)
    flag.rotation.y = Math.sin(t * 2.5) * 0.15;
    flag.position.x = HOLE.flag.x + 0.6 + Math.sin(t * 2.5) * 0.08;

    drawMinimap();
    renderer.render(scene, camera);
  }
  animate();
  </script>
</body>
</html>
