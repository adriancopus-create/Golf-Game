<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Golf Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Georgia', serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-align: center;
      pointer-events: none;
    }
    #hud h1 { font-size: 28px; letter-spacing: 3px; font-weight: normal; }
    #hud p  { font-size: 13px; margin-top: 4px; opacity: 0.75; letter-spacing: 1px; }

    /* ── Power meter ─────────────────────────────────────────────────── */
    #power-wrap {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      user-select: none;
    }
    #power-label {
      color: #fff;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 7px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    #power-bar-bg {
      width: 240px;
      height: 15px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
    }
    #power-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #4ee04e 0%, #f5d020 55%, #e83030 100%);
      border-radius: 8px;
      transition: width 0.05s linear;
    }
    #power-hint {
      color: rgba(255,255,255,0.6);
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 7px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ── Overlay texts ───────────────────────────────────────────────── */
    #shot-text {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: Georgia, serif;
      font-size: 38px;
      letter-spacing: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      pointer-events: none;
      opacity: 0;
    }
    #dist-text {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffe066;
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      pointer-events: none;
      opacity: 0;
    }

    /* ── Reset button ────────────────────────────────────────────────── */
    #reset-btn {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      cursor: pointer;
      padding: 9px 26px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      background: rgba(0,0,0,0.35);
      display: none;
    }
    #reset-btn:hover { background: rgba(255,255,255,0.12); }

    /* ── Mini-map ────────────────────────────────────────────────────── */
    #minimap-wrap {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: none;
      user-select: none;
    }
    #minimap-label {
      color: rgba(255,255,255,0.8);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #minimap {
      display: block;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
    }

    /* ── Club selector ───────────────────────────────────────────────── */
    #club-selector {
      position: absolute;
      bottom: 20px;
      left: 20px;
      user-select: none;
    }
    #club-label {
      color: rgba(255,255,255,0.55);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .club-btn {
      display: block;
      width: 90px;
      margin-bottom: 5px;
      padding: 7px 0;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 3px;
      color: rgba(255,255,255,0.6);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      text-align: center;
    }
    .club-btn:hover:not(.disabled) {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.35);
    }
    .club-btn.active {
      border-color: rgba(255,210,40,0.85);
      color: rgba(255,210,40,0.95);
      background: rgba(255,210,40,0.1);
    }
    .club-btn.disabled {
      opacity: 0.28;
      cursor: not-allowed;
      pointer-events: none;
    }
    .club-key {
      opacity: 0.45;
      font-size: 9px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h1>GOLF</h1>
    <p>HOLE 1 &nbsp;|&nbsp; PAR 3 &nbsp;|&nbsp; 155 YDS</p>
  </div>

  <div id="power-wrap">
    <div id="power-label">POWER</div>
    <div id="power-bar-bg"><div id="power-bar-fill"></div></div>
    <div id="power-hint">&#8592;&#8594; AIM &nbsp;·&nbsp; HOLD SPACE TO SWING</div>
  </div>

  <div id="shot-text">FORE!</div>
  <div id="dist-text"></div>
  <button id="reset-btn">&#8635;&nbsp; BACK TO TEE (R)</button>

  <div id="minimap-wrap">
    <div id="minimap-label">HOLE 1</div>
    <canvas id="minimap" width="120" height="160"></canvas>
  </div>

  <div id="club-selector">
    <div id="club-label">CLUB</div>
    <button class="club-btn active"    data-club="driver"><span class="club-key">[1]</span> DRIVER</button>
    <button class="club-btn"           data-club="iron">  <span class="club-key">[2]</span> IRON</button>
    <button class="club-btn"           data-club="wedge"> <span class="club-key">[3]</span> WEDGE</button>
    <button class="club-btn disabled"  data-club="putter"><span class="club-key">[4]</span> PUTTER</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ─── Physics / game constants ─────────────────────────────────────────────────
  const BALL_RADIUS        = 0.215;
  const GRAVITY            = -22;
  const BOUNCE_RESTITUTION = 0.38;
  const ROLL_FRICTION      = 0.963;
  const STOP_SPEED         = 0.10;

  // ─── Club definitions ────────────────────────────────────────────────────────
  // angle: launch loft in radians; maxTime: seconds to fill power bar
  const CLUBS = {
    driver: { name:'DRIVER', minSpeed:22, maxSpeed:74, angle:0.44, maxTime:2.2, onGreenOnly:false },
    iron:   { name:'IRON',   minSpeed:16, maxSpeed:52, angle:0.52, maxTime:2.2, onGreenOnly:false },
    wedge:  { name:'WEDGE',  minSpeed:11, maxSpeed:36, angle:0.68, maxTime:2.2, onGreenOnly:false },
    putter: { name:'PUTTER', minSpeed: 2, maxSpeed:12, angle:0.03, maxTime:1.5, onGreenOnly:true  },
  };

  // ─── Hole layout data ─────────────────────────────────────────────────────────
  const HOLE = {
    par: 3,
    yardage: 155,
    tee:     { x: 0, z: 0, width: 5, depth: 3 },
    fairway: { x: 0, centerZ: -65, width: 24, length: 130 },
    green:   { x: 0, z: -130, radius: 9, elevation: 0.7 },
    flag:    { x: 0, z: -130, color: 0xee4422 },
    rough:   { flanking: 22 },
  };

  // ─── Game state ───────────────────────────────────────────────────────────────
  let state          = 'idle';
  let chargeStart    = 0;
  let bounceCount    = 0;
  let aimAngle       = 0;      // radians; 0 = straight ahead (-Z); + = right, - = left
  let flightAimAngle = 0;      // captured at launch, used for camera during flight
  let currentClub    = 'driver';
  const vel          = new THREE.Vector3();

  // Smooth camera tracking
  const camCurrent  = new THREE.Vector3(0, 3.5, 10);
  const lookCurrent = new THREE.Vector3(0, 0.5, -10);

  // Input tracking
  const keysHeld    = new Set();
  let isDraggingAim = false;
  let aimDragLastX  = 0;

  // ─── Renderer ────────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // ─── Scene ───────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();

  // ─── Sky gradient sphere ──────────────────────────────────────────────────────
  const skyGeo = new THREE.SphereGeometry(500, 32, 32);
  skyGeo.deleteAttribute('normal');
  skyGeo.deleteAttribute('uv');
  {
    const topC  = new THREE.Color(0x1a6ebe);
    const horizC = new THREE.Color(0x9ecfe8);
    const botC   = new THREE.Color(0x7ab87a);
    const cols   = [];
    const pa     = skyGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) {
      const t = THREE.MathUtils.clamp((pa.getY(i) + 500) / 1000, 0, 1);
      const c = new THREE.Color();
      if (t < 0.15) c.lerpColors(botC, horizC, t / 0.15);
      else           c.lerpColors(horizC, topC, (t - 0.15) / 0.85);
      cols.push(c.r, c.g, c.b);
    }
    skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  }
  scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));

  // ─── Lighting ────────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));
  const sun = new THREE.DirectionalLight(0xfff8d6, 1.4);
  sun.position.set(80, 120, 60);
  sun.castShadow = true;
  sun.shadow.camera.left   = -100;
  sun.shadow.camera.right  =  100;
  sun.shadow.camera.top    =  100;
  sun.shadow.camera.bottom = -100;
  sun.shadow.camera.near   =  0.5;
  sun.shadow.camera.far    =  400;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0003;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xb0d8ff, 0.35);
  fill.position.set(-60, 40, -40);
  scene.add(fill);

  // ─── Procedural grass texture ─────────────────────────────────────────────────
  function buildGrassTexture(size) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const cx = cv.getContext('2d');
    function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
    function noise(x,y){
      const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
      const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
      const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
      return a+(b-a)*ux+(c-a)*uy+(b-a+a-b-c+d)*ux*uy;
    }
    function fbm(x,y){let v=0,a=0.5,f=1;for(let o=0;o<5;o++){v+=a*noise(x*f,y*f);a*=0.5;f*=2.1;}return v;}
    const img = cx.createImageData(size, size);
    for (let py=0;py<size;py++) for (let px=0;px<size;px++){
      const n=fbm(px/size*8,py/size*8),b=0.30+n*0.45,i=(py*size+px)*4;
      img.data[i]=Math.round(b*62);img.data[i+1]=Math.round(b*130);img.data[i+2]=Math.round(b*55);img.data[i+3]=255;
    }
    cx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 20);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // ─── Course geometry ─────────────────────────────────────────────────────────
  const grassTex = buildGrassTexture(512);

  const fairway = new THREE.Mesh(
    new THREE.PlaneGeometry(HOLE.fairway.width, HOLE.fairway.length),
    new THREE.MeshLambertMaterial({ map: grassTex })
  );
  fairway.rotation.x = -Math.PI / 2;
  fairway.position.set(HOLE.fairway.x, 0, HOLE.fairway.centerZ);
  fairway.receiveShadow = true;
  scene.add(fairway);

  const roughMat = new THREE.MeshLambertMaterial({ color: 0x2d6a2d });
  [-1, 1].forEach(side => {
    const r = new THREE.Mesh(
      new THREE.PlaneGeometry(HOLE.rough.flanking, HOLE.fairway.length), roughMat
    );
    r.rotation.x = -Math.PI / 2;
    r.position.set(side * (HOLE.fairway.width/2 + HOLE.rough.flanking/2), -0.01, HOLE.fairway.centerZ);
    r.receiveShadow = true;
    scene.add(r);
  });

  const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshLambertMaterial({ color: 0x2d6a2d })
  );
  backdrop.rotation.x = -Math.PI / 2;
  backdrop.position.set(0, -0.02, -195);
  backdrop.receiveShadow = true;
  scene.add(backdrop);

  // Tee box + peg
  const teeBox = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 4), new THREE.MeshLambertMaterial({ color: 0x5db85d })
  );
  teeBox.rotation.x = -Math.PI / 2;
  teeBox.position.set(0, 0.01, 0);
  teeBox.receiveShadow = true;
  scene.add(teeBox);

  const teePeg = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.025, 0.22, 8),
    new THREE.MeshLambertMaterial({ color: 0xf5c842 })
  );
  teePeg.position.set(0, 0.11, 0);
  teePeg.castShadow = true;
  scene.add(teePeg);

  // Green
  const moundH = HOLE.green.elevation + 0.3;
  const mound = new THREE.Mesh(
    new THREE.CylinderGeometry(HOLE.green.radius, HOLE.green.radius + 2.5, moundH, 32),
    new THREE.MeshLambertMaterial({ color: 0x4a9e4a })
  );
  mound.position.set(HOLE.green.x, HOLE.green.elevation - moundH / 2, HOLE.green.z);
  mound.receiveShadow = true;
  scene.add(mound);

  const greenSurface = new THREE.Mesh(
    new THREE.CircleGeometry(HOLE.green.radius, 32),
    new THREE.MeshLambertMaterial({ color: 0x5dbf5d })
  );
  greenSurface.rotation.x = -Math.PI / 2;
  greenSurface.position.set(HOLE.green.x, HOLE.green.elevation + 0.001, HOLE.green.z);
  greenSurface.receiveShadow = true;
  scene.add(greenSurface);

  // Hole cup
  const cupRim = new THREE.Mesh(
    new THREE.TorusGeometry(0.28, 0.04, 8, 32),
    new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
  );
  cupRim.rotation.x = Math.PI / 2;
  cupRim.position.set(HOLE.flag.x, HOLE.green.elevation + 0.022, HOLE.flag.z);
  scene.add(cupRim);

  const cupBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.27, 0.27, 0.5, 16),
    new THREE.MeshBasicMaterial({ color: 0x111111 })
  );
  cupBody.position.set(HOLE.flag.x, HOLE.green.elevation - 0.25, HOLE.flag.z);
  scene.add(cupBody);

  // Flagstick
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 5.5, 8),
    new THREE.MeshLambertMaterial({ color: 0xdddddd })
  );
  pole.position.set(HOLE.flag.x, HOLE.green.elevation + 2.75, HOLE.flag.z);
  pole.castShadow = true;
  scene.add(pole);

  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 0.8),
    new THREE.MeshLambertMaterial({ color: HOLE.flag.color, side: THREE.DoubleSide })
  );
  flag.position.set(HOLE.flag.x + 0.6, HOLE.green.elevation + 5.1, HOLE.flag.z);
  scene.add(flag);

  // Golf ball
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 32, 32),
    new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xaaaaaa, shininess: 120 })
  );
  ball.position.set(0, BALL_RADIUS + 0.115, 0);
  ball.castShadow = true;
  scene.add(ball);

  // Ball blob shadow
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.38, depthWrite: false,
  });
  const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), shadowMat);
  ballShadow.rotation.x = -Math.PI / 2;
  ballShadow.position.y = 0.021;
  scene.add(ballShadow);

  // ─── Aim line (dashed, on ground) ────────────────────────────────────────────
  const AIM_PTS = 22;
  const aimPosBuf = new Float32Array(AIM_PTS * 3);
  const aimLineGeo = new THREE.BufferGeometry();
  aimLineGeo.setAttribute('position', new THREE.BufferAttribute(aimPosBuf, 3));
  const aimLine = new THREE.Line(aimLineGeo, new THREE.LineDashedMaterial({
    color: 0xffffff, dashSize: 0.85, gapSize: 0.55,
    transparent: true, opacity: 0.72,
  }));
  aimLine.visible = false;
  scene.add(aimLine);

  // Aim arrowhead cone (inside a group so rotation.y drives aim direction)
  const aimArrowGroup = new THREE.Group();
  const aimCone = new THREE.Mesh(
    new THREE.ConeGeometry(0.32, 0.9, 8),
    new THREE.MeshBasicMaterial({ color: 0xffde3a, transparent: true, opacity: 0.88 })
  );
  aimCone.rotation.x = Math.PI / 2;   // default cone points +Y; rotate to point -Z
  aimArrowGroup.add(aimCone);
  aimArrowGroup.visible = false;
  scene.add(aimArrowGroup);

  // ─── Trajectory arc line ─────────────────────────────────────────────────────
  const ARC_CAP = 80;
  const arcPosBuf = new Float32Array(ARC_CAP * 3);
  const arcLineGeo = new THREE.BufferGeometry();
  arcLineGeo.setAttribute('position', new THREE.BufferAttribute(arcPosBuf, 3));
  arcLineGeo.setDrawRange(0, 0);
  const arcLine = new THREE.Line(arcLineGeo, new THREE.LineBasicMaterial({
    color: 0xffde3a, transparent: true, opacity: 0.50,
  }));
  arcLine.visible = false;
  scene.add(arcLine);

  // ─── Horizon hills ───────────────────────────────────────────────────────────
  function addHills(z, w, h, color) {
    const geo = new THREE.CylinderGeometry(0, w * 0.5, h, 6);
    const mat = new THREE.MeshLambertMaterial({ color });
    for (let x = -200; x <= 200; x += 55 + Math.random() * 30) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, h * 0.5 - 0.5, z);
      scene.add(m);
    }
  }
  addHills(-210, 120, 18, 0x2d7a2d);
  addHills(-195,  90, 12, 0x3a8c3a);
  addHills(-185,  70,  8, 0x4a9e4a);

  // ─── Camera ──────────────────────────────────────────────────────────────────
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(camCurrent);
  camera.lookAt(lookCurrent);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─── UI refs ─────────────────────────────────────────────────────────────────
  const powerWrap = document.getElementById('power-wrap');
  const powerFill = document.getElementById('power-bar-fill');
  const shotText  = document.getElementById('shot-text');
  const distText  = document.getElementById('dist-text');
  const resetBtn  = document.getElementById('reset-btn');
  const mmCanvas  = document.getElementById('minimap');
  const mmCtx     = mmCanvas.getContext('2d');

  // ─── Club logic ──────────────────────────────────────────────────────────────
  function isOnGreen() {
    const dx = ball.position.x - HOLE.green.x;
    const dz = ball.position.z - HOLE.green.z;
    return Math.sqrt(dx * dx + dz * dz) < HOLE.green.radius;
  }

  function setClub(key) {
    if (!CLUBS[key]) return;
    if (CLUBS[key].onGreenOnly && !isOnGreen()) return;
    currentClub = key;
    updateClubSelector();
  }

  function updateClubSelector() {
    const onGreen = isOnGreen();
    document.querySelectorAll('.club-btn').forEach(btn => {
      const k = btn.dataset.club;
      btn.classList.toggle('active',   k === currentClub);
      btn.classList.toggle('disabled', CLUBS[k].onGreenOnly && !onGreen);
    });
    if (currentClub === 'putter' && !onGreen) {
      currentClub = 'driver';
      document.querySelectorAll('.club-btn').forEach(b => b.classList.toggle('active', b.dataset.club === 'driver'));
    }
  }

  document.querySelectorAll('.club-btn').forEach(btn => {
    btn.addEventListener('click',     e => { e.stopPropagation(); setClub(btn.dataset.club); });
    btn.addEventListener('mousedown', e => e.stopPropagation());
    btn.addEventListener('mouseup',   e => e.stopPropagation());
  });

  // ─── Flash helpers ───────────────────────────────────────────────────────────
  function flashText(el, msg, duration = 1400) {
    el.textContent = msg;
    el.style.transition = 'none';
    el.style.opacity    = '1';
    setTimeout(() => { el.style.transition = 'opacity 0.9s'; el.style.opacity = '0'; }, duration);
  }

  function showStopped() {
    const dist = Math.round(Math.abs(ball.position.z) * 1.15);
    flashText(distText, dist + ' YDS', 5000);
    resetBtn.style.display = 'block';
    updateClubSelector();
    // Auto-resume idle so player can putt/chip from where ball lies
    setTimeout(() => {
      if (state === 'stopped') {
        state = 'idle';
        powerWrap.style.display = 'block';
      }
    }, 1500);
  }

  function reset() {
    ball.position.set(0, BALL_RADIUS + 0.115, 0);
    ball.rotation.set(0, 0, 0);
    vel.set(0, 0, 0);
    bounceCount    = 0;
    aimAngle       = 0;
    state          = 'idle';
    teePeg.visible = true;
    currentClub    = 'driver';

    distText.style.transition = 'none';
    distText.style.opacity    = '0';
    resetBtn.style.display    = 'none';
    powerWrap.style.display   = 'block';

    camCurrent.set(0, 3.5, 10);
    lookCurrent.set(0, 0.5, -10);

    updateClubSelector();
    updateBlobShadow();
  }

  // ─── Input ───────────────────────────────────────────────────────────────────
  function startCharge() {
    if (state !== 'idle') return;
    state       = 'charging';
    chargeStart = performance.now() / 1000;
  }

  function releaseSwing() {
    if (state !== 'charging') return;
    const club    = CLUBS[currentClub];
    const elapsed = performance.now() / 1000 - chargeStart;
    const power   = Math.min(1, elapsed / club.maxTime);
    if (power < 0.04) { state = 'idle'; return; }

    const speed  = THREE.MathUtils.lerp(club.minSpeed, club.maxSpeed, power);
    const hSpeed = speed * Math.cos(club.angle);
    const vSpeed = speed * Math.sin(club.angle);
    const dirX   =  Math.sin(aimAngle);
    const dirZ   = -Math.cos(aimAngle);

    vel.set(dirX * hSpeed, vSpeed, dirZ * hSpeed);
    flightAimAngle = aimAngle;

    bounceCount = 0;
    state       = 'flying';
    teePeg.visible       = false;
    powerWrap.style.display = 'none';
    flashText(shotText, 'FORE!', 700);
  }

  // Keyboard
  window.addEventListener('keydown', e => {
    keysHeld.add(e.code);
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startCharge(); }
    if (e.code === 'KeyR')  reset();
    if (e.code === 'Digit1') setClub('driver');
    if (e.code === 'Digit2') setClub('iron');
    if (e.code === 'Digit3') setClub('wedge');
    if (e.code === 'Digit4') setClub('putter');
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    keysHeld.delete(e.code);
    if (e.code === 'Space') releaseSwing();
  });

  // Mouse: drag = aim, click = charge/swing
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDraggingAim = false;
    aimDragLastX  = e.clientX;
    startCharge();
  });
  window.addEventListener('mousemove', e => {
    if (!(e.buttons & 1)) return;
    if (state !== 'idle' && state !== 'charging') return;
    const dx = e.clientX - aimDragLastX;
    if (Math.abs(dx) > 3) {
      isDraggingAim = true;
      if (state === 'charging') state = 'idle'; // cancel charge, just aim
      aimAngle += dx * 0.004;
      aimAngle  = THREE.MathUtils.clamp(aimAngle, -Math.PI * 0.6, Math.PI * 0.6);
      aimDragLastX = e.clientX;
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    if (e.target.classList && e.target.classList.contains('club-btn')) return;
    if (!isDraggingAim) releaseSwing();
    isDraggingAim = false;
  });
  resetBtn.addEventListener('click', reset);

  // ─── Ground elevation helper ──────────────────────────────────────────────────
  function getGroundY(x, z) {
    const dx = x - HOLE.green.x, dz = z - HOLE.green.z;
    return (Math.sqrt(dx*dx + dz*dz) < HOLE.green.radius - 0.3) ? HOLE.green.elevation : 0;
  }

  // ─── Blob shadow ─────────────────────────────────────────────────────────────
  function updateBlobShadow() {
    ballShadow.position.x = ball.position.x;
    ballShadow.position.z = ball.position.z;
    const gy      = getGroundY(ball.position.x, ball.position.z);
    ballShadow.position.y = gy + 0.021;
    const height  = Math.max(0, ball.position.y - BALL_RADIUS - gy);
    ballShadow.scale.setScalar(Math.max(0.12, 1.0 - height * 0.022));
    shadowMat.opacity = Math.max(0.03, 0.38 - height * 0.009);
  }

  // ─── Trajectory simulation ───────────────────────────────────────────────────
  function getTrajectoryPoints() {
    const club  = CLUBS[currentClub];
    const power = (state === 'charging')
      ? Math.min(1, (performance.now()/1000 - chargeStart) / club.maxTime)
      : 0.78;
    const speed  = THREE.MathUtils.lerp(club.minSpeed, club.maxSpeed, power);
    const hSpeed = speed * Math.cos(club.angle);
    const dirX   =  Math.sin(aimAngle);
    const dirZ   = -Math.cos(aimAngle);

    let px = ball.position.x, py = ball.position.y, pz = ball.position.z;
    let pvy = speed * Math.sin(club.angle);
    const SIM_DT = 0.07;
    const pts = [[px, py, pz]];
    for (let i = 0; i < ARC_CAP - 1; i++) {
      pvy += GRAVITY * SIM_DT;
      px  += dirX * hSpeed * SIM_DT;
      py  += pvy  * SIM_DT;
      pz  += dirZ * hSpeed * SIM_DT;
      const floorY = getGroundY(px, pz) + BALL_RADIUS;
      if (py <= floorY) { pts.push([px, floorY, pz]); break; }
      pts.push([px, py, pz]);
    }
    return pts;
  }

  // ─── Aim line update ─────────────────────────────────────────────────────────
  function updateAimVisuals() {
    const vis = state === 'idle' || state === 'charging';
    aimLine.visible       = vis;
    aimArrowGroup.visible = vis;
    arcLine.visible       = vis;
    if (!vis) { arcLineGeo.setDrawRange(0, 0); return; }

    const club   = CLUBS[currentClub];
    const lineLen = 5 + club.maxSpeed * 0.20;
    const dirX   =  Math.sin(aimAngle);
    const dirZ   = -Math.cos(aimAngle);
    const aimPos = aimLineGeo.attributes.position;

    for (let i = 0; i < AIM_PTS; i++) {
      const t  = i / (AIM_PTS - 1);
      const wx = ball.position.x + dirX * t * lineLen;
      const wz = ball.position.z + dirZ * t * lineLen;
      aimPos.setXYZ(i, wx, getGroundY(wx, wz) + 0.06, wz);
    }
    aimPos.needsUpdate = true;
    aimLine.computeLineDistances();

    // Arrow at end
    const ex = ball.position.x + dirX * lineLen;
    const ez = ball.position.z + dirZ * lineLen;
    aimArrowGroup.position.set(ex, getGroundY(ex, ez) + 0.22, ez);
    // rotation.y = -aimAngle: rotates cone (default -Z) to aim direction (sin, 0, -cos)
    aimArrowGroup.rotation.y = -aimAngle;

    // Arc
    const pts    = getTrajectoryPoints();
    const arcPos = arcLineGeo.attributes.position;
    const cnt    = Math.min(pts.length, ARC_CAP);
    for (let i = 0; i < cnt; i++) arcPos.setXYZ(i, pts[i][0], pts[i][1] + 0.05, pts[i][2]);
    arcPos.needsUpdate = true;
    arcLineGeo.setDrawRange(0, cnt);
  }

  // ─── Physics ─────────────────────────────────────────────────────────────────
  function stepPhysics(dt) {
    if (state !== 'flying' && state !== 'rolling') return;

    if (state === 'flying') {
      vel.y += GRAVITY * dt;
      ball.position.addScaledVector(vel, dt);
      // Spin perpendicular to horizontal travel direction
      ball.rotation.x -= vel.z * dt * 3.5;
      ball.rotation.z += vel.x * dt * 3.5;

      const floorY = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;
      if (ball.position.y <= floorY) {
        ball.position.y = floorY;
        if (Math.abs(vel.y) > 1.8 && bounceCount < 3) {
          vel.y *= -BOUNCE_RESTITUTION;
          vel.x *=  0.80;
          vel.z *=  0.85;
          bounceCount++;
        } else {
          vel.y = 0;
          state = 'rolling';
        }
      }
    }

    if (state === 'rolling') {
      ball.position.addScaledVector(vel, dt);
      ball.rotation.x -= vel.z * dt * 3.5;
      ball.rotation.z += vel.x * dt * 3.5;
      const f = Math.pow(ROLL_FRICTION, dt * 60);
      vel.x *= f; vel.z *= f; vel.y = 0;
      ball.position.y = getGroundY(ball.position.x, ball.position.z) + BALL_RADIUS;

      if (Math.sqrt(vel.x*vel.x + vel.z*vel.z) < STOP_SPEED) {
        vel.set(0, 0, 0);
        state = 'stopped';
        showStopped();
      }
    }

    updateBlobShadow();
  }

  // ─── Camera ──────────────────────────────────────────────────────────────────
  function updateCamera(dt, t) {
    let targetPos, targetLook, lerpK;

    if (state === 'idle' || state === 'charging') {
      // Stay behind ball in aim direction
      const bob = Math.sin(t * 0.4) * 0.04;
      targetPos  = new THREE.Vector3(
        ball.position.x - Math.sin(aimAngle) * 10,
        ball.position.y + 3.5 + bob,
        ball.position.z + Math.cos(aimAngle) * 10
      );
      targetLook = new THREE.Vector3(
        ball.position.x + Math.sin(aimAngle) * 8,
        ball.position.y + 0.5,
        ball.position.z - Math.cos(aimAngle) * 8
      );
      lerpK = 5;
    } else if (state === 'stopped') {
      targetPos  = new THREE.Vector3(ball.position.x, ball.position.y + 3.2, ball.position.z + 10);
      targetLook = new THREE.Vector3(ball.position.x, ball.position.y + 0.3, ball.position.z - 12);
      lerpK = 1.5;
    } else {
      // During flight: follow from behind based on shot direction
      targetPos  = new THREE.Vector3(
        ball.position.x - Math.sin(flightAimAngle) * 12,
        ball.position.y + 4.8,
        ball.position.z + Math.cos(flightAimAngle) * 12
      );
      targetLook = new THREE.Vector3(
        ball.position.x + Math.sin(flightAimAngle) * 18,
        ball.position.y - 0.5,
        ball.position.z - Math.cos(flightAimAngle) * 18
      );
      lerpK = 4.5;
    }

    camCurrent.lerp(targetPos, dt * lerpK);
    lookCurrent.lerp(targetLook, dt * lerpK);
    camera.position.copy(camCurrent);
    camera.lookAt(lookCurrent);
  }

  // ─── Power bar ───────────────────────────────────────────────────────────────
  function updatePowerBar() {
    const club = CLUBS[currentClub];
    if (state === 'charging') {
      const elapsed = performance.now() / 1000 - chargeStart;
      powerFill.style.width = Math.min(100, elapsed / club.maxTime * 100) + '%';
    } else if (state === 'idle') {
      powerFill.style.width = '0%';
    }
  }

  // ─── Aiming via held arrow keys ───────────────────────────────────────────────
  function updateAiming(dt) {
    if (state !== 'idle' && state !== 'charging') return;
    const AIM_SPEED = 1.6; // rad/s
    if (keysHeld.has('ArrowLeft'))  aimAngle -= AIM_SPEED * dt;
    if (keysHeld.has('ArrowRight')) aimAngle += AIM_SPEED * dt;
    aimAngle = THREE.MathUtils.clamp(aimAngle, -Math.PI * 0.6, Math.PI * 0.6);
  }

  // ─── Mini-map ────────────────────────────────────────────────────────────────
  function wmX(wx) { return (wx + 40) / 80 * 120; }
  function wmZ(wz) { return (-wz + 8) / 156 * 160; }

  function drawMinimap() {
    mmCtx.clearRect(0, 0, 120, 160);
    mmCtx.fillStyle = 'rgba(20,40,20,0.88)';
    mmCtx.fillRect(0, 0, 120, 160);

    const fwHW  = HOLE.fairway.width / 2;
    const fwLX  = wmX(-fwHW), fwRX = wmX(fwHW);
    const fwTop = wmZ(HOLE.fairway.centerZ + HOLE.fairway.length / 2);
    const fwBot = wmZ(HOLE.fairway.centerZ - HOLE.fairway.length / 2);
    const fwH   = fwBot - fwTop, fwW = fwRX - fwLX;

    // Rough
    mmCtx.fillStyle = '#2d5a2d';
    mmCtx.fillRect(wmX(-fwHW - HOLE.rough.flanking), fwTop, wmX(-fwHW) - wmX(-fwHW - HOLE.rough.flanking), fwH);
    mmCtx.fillRect(fwRX, fwTop, wmX(fwHW + HOLE.rough.flanking) - fwRX, fwH);
    // Fairway
    mmCtx.fillStyle = '#4a9e4a';
    mmCtx.fillRect(fwLX, fwTop, fwW, fwH);
    // Green
    mmCtx.beginPath();
    mmCtx.arc(wmX(HOLE.green.x), wmZ(HOLE.green.z), HOLE.green.radius / 80 * 120, 0, Math.PI*2);
    mmCtx.fillStyle = '#5dbf5d'; mmCtx.fill();
    // Tee
    mmCtx.fillStyle = '#7de07d';
    mmCtx.fillRect(wmX(-1.5), wmZ(1.5), 3, 3);
    // Flag
    mmCtx.beginPath();
    mmCtx.arc(wmX(HOLE.flag.x), wmZ(HOLE.flag.z), 2, 0, Math.PI*2);
    mmCtx.fillStyle = '#ffffff'; mmCtx.fill();

    // Aim direction + predicted landing (only in idle/charging)
    if (state === 'idle' || state === 'charging') {
      const bx   = wmX(ball.position.x), bz = wmZ(ball.position.z);
      const pts  = getTrajectoryPoints();
      const land = pts[pts.length - 1];
      const ex   = wmX(land[0]), ez = wmZ(land[2]);

      // Aim line (dashed)
      mmCtx.save();
      mmCtx.setLineDash([3, 3]);
      mmCtx.strokeStyle = 'rgba(255,218,40,0.85)';
      mmCtx.lineWidth   = 1.5;
      mmCtx.beginPath(); mmCtx.moveTo(bx, bz); mmCtx.lineTo(ex, ez);
      mmCtx.stroke();
      mmCtx.restore();

      // Landing prediction dot
      mmCtx.beginPath();
      mmCtx.arc(ex, ez, 3, 0, Math.PI*2);
      mmCtx.fillStyle = 'rgba(255,218,40,0.80)'; mmCtx.fill();
    }

    // Ball shadow
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x)+1, wmZ(ball.position.z)+1, 3.5, 0, Math.PI*2);
    mmCtx.fillStyle = 'rgba(0,0,0,0.45)'; mmCtx.fill();
    // Ball
    mmCtx.beginPath();
    mmCtx.arc(wmX(ball.position.x), wmZ(ball.position.z), 4, 0, Math.PI*2);
    mmCtx.fillStyle = 'rgba(255,255,255,0.95)'; mmCtx.fill();
    // Labels
    mmCtx.fillStyle = 'rgba(255,255,255,0.4)';
    mmCtx.font = '8px Georgia';
    mmCtx.fillText('T', wmX(2.5), wmZ(-2));
    mmCtx.fillText('G', wmX(HOLE.green.x + HOLE.green.radius + 0.5), wmZ(HOLE.green.z));
  }

  // ─── Main loop ────────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    updateAiming(dt);
    stepPhysics(dt);
    updateCamera(dt, t);
    updatePowerBar();
    updateAimVisuals();

    flag.rotation.y = Math.sin(t * 2.5) * 0.15;
    flag.position.x = HOLE.flag.x + 0.6 + Math.sin(t * 2.5) * 0.08;

    drawMinimap();
    renderer.render(scene, camera);
  }
  animate();
  </script>
</body>
</html>
