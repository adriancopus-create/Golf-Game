<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Golf Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 18px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-align: center;
      pointer-events: none;
    }
    #hud h1 { font-size: 28px; letter-spacing: 3px; font-weight: normal; }
    #hud p  { font-size: 13px; margin-top: 4px; opacity: 0.75; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>GOLF</h1>
    <p>HOLE 1 &nbsp;|&nbsp; PAR 4 &nbsp;|&nbsp; 380 YDS</p>
  </div>

  <!-- Three.js r158 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  // ─── Renderer ────────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // ─── Scene ───────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();

  // ─── Sky gradient via a large sphere with vertex colors ──────────────────────
  const skyGeo = new THREE.SphereGeometry(500, 32, 32);
  skyGeo.deleteAttribute('normal');
  skyGeo.deleteAttribute('uv');

  // Assign per-vertex colors to create a vertical gradient
  const skyColors = [];
  const topColor    = new THREE.Color(0x1a6ebe);   // deep blue
  const horizonColor = new THREE.Color(0x9ecfe8);  // light hazy blue
  const bottomColor  = new THREE.Color(0x7ab87a);  // faint green tint near ground

  const posArr = skyGeo.attributes.position;
  for (let i = 0; i < posArr.count; i++) {
    const y = posArr.getY(i);
    // y ranges roughly from -500 to +500
    const t = THREE.MathUtils.clamp((y + 500) / 1000, 0, 1); // 0=bottom, 1=top
    const c = new THREE.Color();
    if (t < 0.15) {
      c.lerpColors(bottomColor, horizonColor, t / 0.15);
    } else {
      c.lerpColors(horizonColor, topColor, (t - 0.15) / 0.85);
    }
    skyColors.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));

  const skyMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ─── Lighting ────────────────────────────────────────────────────────────────
  const ambient = new THREE.AmbientLight(0xfff4e0, 0.55);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff8d6, 1.4);
  sun.position.set(80, 120, 60);
  sun.castShadow = true;
  sun.shadow.camera.left   = -80;
  sun.shadow.camera.right  =  80;
  sun.shadow.camera.top    =  80;
  sun.shadow.camera.bottom = -80;
  sun.shadow.camera.near   =  0.5;
  sun.shadow.camera.far    =  400;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0003;
  scene.add(sun);

  // Soft fill light from the other side
  const fill = new THREE.DirectionalLight(0xb0d8ff, 0.35);
  fill.position.set(-60, 40, -40);
  scene.add(fill);

  // ─── Procedural grass texture ─────────────────────────────────────────────────
  // Build a 512×512 canvas texture using value noise for subtle colour variation
  function buildGrassTexture(size) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Simple pseudo-random hash
    function hash(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }
    // Value noise: bilinear blend of 4 corner hashes
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash(ix,   iy);
      const b = hash(ix+1, iy);
      const c = hash(ix,   iy+1);
      const d = hash(ix+1, iy+1);
      return a + (b-a)*ux + (c-a)*uy + (b-a+a-b-c+d)*ux*uy; // bilinear
    }
    // Layered octaves for a more natural look
    function fbm(x, y) {
      let v = 0, amp = 0.5, freq = 1;
      for (let o = 0; o < 5; o++) {
        v += amp * noise(x * freq, y * freq);
        amp  *= 0.5;
        freq *= 2.1;
      }
      return v;
    }

    const imageData = ctx.createImageData(size, size);
    const data = imageData.data;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const nx = px / size * 8;
        const ny = py / size * 8;
        const n  = fbm(nx, ny);          // 0..1 roughly
        // Base fairway green, modulate brightness by noise
        const base = 0.30 + n * 0.45;   // 0.30–0.75
        const r = Math.round(base * 62);
        const g = Math.round(base * 130);
        const b = Math.round(base * 55);
        const i = (py * size + px) * 4;
        data[i]   = r;
        data[i+1] = g;
        data[i+2] = b;
        data[i+3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(40, 40);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // ─── Fairway plane ───────────────────────────────────────────────────────────
  const fairwayGeo = new THREE.PlaneGeometry(300, 600, 1, 1);
  const grassTex   = buildGrassTexture(512);
  const fairwayMat = new THREE.MeshLambertMaterial({ map: grassTex });
  const fairway    = new THREE.Mesh(fairwayGeo, fairwayMat);
  fairway.rotation.x = -Math.PI / 2;
  fairway.position.set(0, 0, -150);   // extend forward away from camera
  fairway.receiveShadow = true;
  scene.add(fairway);

  // Subtle rough / fringe on the sides — darker strips
  function addRough(x, z) {
    const roughGeo = new THREE.PlaneGeometry(60, 600, 1, 1);
    const roughMat = new THREE.MeshLambertMaterial({ color: 0x2d6a2d });
    const rough    = new THREE.Mesh(roughGeo, roughMat);
    rough.rotation.x = -Math.PI / 2;
    rough.position.set(x, -0.01, z);
    rough.receiveShadow = true;
    scene.add(rough);
  }
  addRough(-105, -150);
  addRough( 105, -150);

  // ─── Tee marker ──────────────────────────────────────────────────────────────
  // Small rectangular tee box with a slightly lighter colour
  const teeBoxGeo = new THREE.PlaneGeometry(6, 4);
  const teeBoxMat = new THREE.MeshLambertMaterial({ color: 0x5db85d });
  const teeBox    = new THREE.Mesh(teeBoxGeo, teeBoxMat);
  teeBox.rotation.x = -Math.PI / 2;
  teeBox.position.set(0, 0.01, 0);
  teeBox.receiveShadow = true;
  scene.add(teeBox);

  // ─── Tee peg ─────────────────────────────────────────────────────────────────
  // Tapered cylinder: narrow at bottom, wider (cup-like) at top
  const teePegGeo = new THREE.CylinderGeometry(0.05, 0.025, 0.22, 8);
  const teePegMat = new THREE.MeshLambertMaterial({ color: 0xf5c842 });
  const teePeg    = new THREE.Mesh(teePegGeo, teePegMat);
  teePeg.position.set(0, 0.11, 0);
  teePeg.castShadow = true;
  scene.add(teePeg);

  // ─── Golf ball ───────────────────────────────────────────────────────────────
  const ballGeo = new THREE.SphereGeometry(0.215, 32, 32);
  const ballMat = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    specular: 0xaaaaaa,
    shininess: 120,
  });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(0, 0.33, 0);   // sits on top of the tee peg
  ball.castShadow = true;
  scene.add(ball);

  // ─── Distant flag / pin ───────────────────────────────────────────────────────
  const flagDist = -280;

  // Pin pole
  const poleGeo = new THREE.CylinderGeometry(0.04, 0.04, 6, 8);
  const poleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  const pole    = new THREE.Mesh(poleGeo, poleMat);
  pole.position.set(0, 3, flagDist);
  pole.castShadow = true;
  scene.add(pole);

  // Flag
  const flagGeo = new THREE.PlaneGeometry(1.5, 0.9);
  const flagMat = new THREE.MeshLambertMaterial({ color: 0xee2222, side: THREE.DoubleSide });
  const flag    = new THREE.Mesh(flagGeo, flagMat);
  flag.position.set(0.75, 5.55, flagDist);
  scene.add(flag);

  // Cup circle on the green
  const cupGeo = new THREE.CircleGeometry(0.25, 32);
  const cupMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const cup    = new THREE.Mesh(cupGeo, cupMat);
  cup.rotation.x = -Math.PI / 2;
  cup.position.set(0, 0.015, flagDist);
  scene.add(cup);

  // ─── Gentle rolling hills on the horizon ─────────────────────────────────────
  function addHillStrip(z, width, height, color) {
    const geo = new THREE.CylinderGeometry(0, width * 0.5, height, 6, 1);
    const mat = new THREE.MeshLambertMaterial({ color });
    for (let x = -200; x <= 200; x += 55 + Math.random() * 30) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, height * 0.5 - 0.5, z);
      scene.add(m);
    }
  }
  addHillStrip(-310, 120, 18, 0x2d7a2d);
  addHillStrip(-280, 90,  12, 0x3a8c3a);
  addHillStrip(-260, 70,  8,  0x4a9e4a);

  // ─── Camera ──────────────────────────────────────────────────────────────────
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  // Third-person: behind and above the ball, looking toward the flag
  camera.position.set(0, 3.5, 10);
  camera.lookAt(ball.position.clone().add(new THREE.Vector3(0, 0.3, -10)));

  // ─── Resize handler ──────────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─── Subtle flag & scene animation ───────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Gentle flag wave
    flag.rotation.y = Math.sin(t * 2.5) * 0.15;
    flag.position.x = 0.75 + Math.sin(t * 2.5) * 0.08;

    // Very subtle camera bob for liveliness
    camera.position.y = 3.5 + Math.sin(t * 0.4) * 0.04;

    renderer.render(scene, camera);
  }
  animate();
  </script>
</body>
</html>
